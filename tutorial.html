<meta charset="utf-8">
<title>Anatomia della Stranezza</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: una slide per passo della catena. In alto la catena degli effetti (dove sei), al centro testo tecnico a sinistra ed esperimento a destra, in basso la navigazione. */
:root {
  --bg: #eef0f5;
  --panel: #ffffff;
  --ink: #161827;
  --muted: #5b6075;
  --line: #d8dbe6;
  --accent: #5847d6;
  --accent-ink: #ffffff;
  --accent-soft: #e6e3fb;
  --plot-bg: #f5f6fa;
  --ghost: #8a8fa3;
  --done: #13917f;
  --icse: #d4473a;
  --fse: #13917f;
  --ase: #c47a0c;
  --font-text: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1017; --panel: #161925; --ink: #e7e8f0; --muted: #9298ad; --line: #292e3d;
    --accent: #9b8cff; --accent-ink: #12101f; --accent-soft: #262245; --plot-bg: #10131b; --ghost: #737991; --done: #3fcab6;
    --icse: #ff6f61; --fse: #3fcab6; --ase: #f2aa3c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1017; --panel: #161925; --ink: #e7e8f0; --muted: #9298ad; --line: #292e3d;
  --accent: #9b8cff; --accent-ink: #12101f; --accent-soft: #262245; --plot-bg: #10131b; --ghost: #737991; --done: #3fcab6;
  --icse: #ff6f61; --fse: #3fcab6; --ase: #f2aa3c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-text); font-size: 15px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 0;
}
.app { max-width: 1400px; margin: 0 auto; display: grid; gap: 14px; }
.top { display: grid; gap: 10px; }
.brand { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
.brand h1 { font-size: 1.35rem; margin: 0; letter-spacing: -0.02em; }
.brand p { margin: 0; color: var(--muted); font-size: 0.9rem; }
.chain { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.chain button {
  font: 500 0.78rem var(--font-text); border: 1px solid var(--line); background: var(--panel); color: var(--muted);
  border-radius: 999px; padding: 3px 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px;
}
.chain button[aria-current="step"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chain button.done:not([aria-current="step"]) { color: var(--done); border-color: var(--done); }
.chain button.done::before { content: "✓"; font-weight: 700; }
.chain .arrow { color: var(--line); font-size: 0.8rem; }

.slide { display: grid; grid-template-columns: minmax(0, 0.95fr) minmax(0, 1.05fr); gap: 18px; align-items: start; outline: none; }
@media (max-width: 960px) { .slide { grid-template-columns: minmax(0, 1fr); } }
.text { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px 24px; min-width: 0; }
.text .kicker { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); margin: 0 0 4px; }
.text h2 { font-size: 1.55rem; line-height: 1.2; margin: 0 0 12px; letter-spacing: -0.015em; text-wrap: balance; }
.text h3 { font-size: 1rem; margin: 18px 0 6px; }
.text p, .text li { max-width: 68ch; }
.text p { margin: 0 0 10px; }
.text ul, .text ol { padding-left: 20px; margin: 0 0 10px; }
.text li { margin-bottom: 6px; }
.formula {
  font-family: var(--font-mono); font-size: 0.88rem; background: var(--plot-bg); border: 1px solid var(--line);
  border-radius: 8px; padding: 10px 14px; margin: 10px 0 14px; overflow-x: auto; white-space: nowrap;
}
.formula div + div { margin-top: 4px; }
.listen { border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 8px 8px 0; padding: 10px 14px; margin-top: 14px; }
.listen b { display: block; font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 2px; }
.listen p:last-child { margin-bottom: 0; }

.lab { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; display: grid; gap: 14px; min-width: 0; }
.lab-title { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin: 0; }
.ctls { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px 18px; }
.ctl { display: grid; gap: 3px; }
.ctl-head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.ctl label { font-weight: 500; font-size: 0.9rem; }
.val { font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.ctl .help { font-size: 0.78rem; color: var(--muted); margin: 0; }
input[type="range"] { width: 100%; accent-color: var(--accent); margin: 0; }
.s-ctl { background: var(--accent-soft); border-radius: 8px; padding: 8px 10px; }
.s-ctl label { color: var(--accent); font-weight: 600; }
button, select { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 6px 12px; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--muted); }
button:disabled { opacity: 0.5; cursor: default; }
button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.plays { display: flex; flex-wrap: wrap; gap: 8px; }
.plays button { display: inline-flex; align-items: center; gap: 6px; font-size: 0.88rem; }
.plays button::before { content: ""; width: 0; height: 0; border-left: 8px solid currentColor; border-top: 5px solid transparent; border-bottom: 5px solid transparent; }
.seg { display: flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; width: fit-content; max-width: 100%; }
.seg button { border: 0; border-radius: 0; border-right: 1px solid var(--line); padding: 5px 11px; background: transparent; font-size: 0.85rem; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.check { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; font-size: 0.88rem; }
.check input { accent-color: var(--accent); margin: 0; }
.plot { width: 100%; display: block; background: var(--plot-bg); border: 1px solid var(--line); border-radius: 8px; }
.cap { font-size: 0.78rem; color: var(--muted); margin: -8px 0 0; }
.readout { font-family: var(--font-mono); font-size: 0.82rem; font-variant-numeric: tabular-nums; background: var(--plot-bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; display: grid; gap: 2px; overflow-x: auto; }
.readout span { color: var(--muted); }

.nav {
  position: sticky; bottom: 0; background: var(--bg); border-top: 1px solid var(--line);
  padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; z-index: 5;
}
.nav-mid { display: flex; align-items: center; gap: 10px; font-size: 0.85rem; color: var(--muted); flex: 1; min-width: 0; }
.playing { font-family: var(--font-mono); font-size: 0.78rem; color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav-right { display: flex; gap: 8px; }

/* diagramma della catena */
.flow { display: grid; gap: 8px; }
.flow .row { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 10px; align-items: stretch; }
.flow .tag { font-size: 0.7rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding-top: 9px; }
.flow .boxes { display: flex; flex-wrap: wrap; gap: 6px; }
.flow .box { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; background: var(--plot-bg); font-size: 0.86rem; }
.flow .box small { display: block; font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); }
.flow .box.s { border-color: var(--accent); background: var(--accent-soft); }
.flow .down { color: var(--muted); font-size: 0.8rem; padding-left: 122px; line-height: 1; }
@media (max-width: 520px) { .flow .row { grid-template-columns: minmax(0, 1fr); } .flow .down { padding-left: 8px; } .flow .tag { padding-top: 0; } }

table.map { border-collapse: collapse; width: 100%; font-size: 0.86rem; }
table.map th, table.map td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.map th { font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.table-wrap { overflow-x: auto; }
.quiz { border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 10px; }
.answers { display: flex; flex-wrap: wrap; gap: 6px; }
.answers button.right { background: var(--done); border-color: var(--done); color: var(--accent-ink); }
.answers button.wrong { border-color: var(--icse); color: var(--icse); }
.feedback { font-size: 0.88rem; min-height: 1.4em; }
.big-link { display: inline-flex; align-items: center; gap: 8px; background: var(--accent); color: var(--accent-ink); text-decoration: none; font-weight: 600; padding: 12px 18px; border-radius: 10px; width: fit-content; }
@media (prefers-reduced-motion: no-preference) { .slide { animation: enter 0.25s ease-out; } @keyframes enter { from { opacity: 0.4; transform: translateY(4px); } } }
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <h1>Anatomia della Stranezza</h1>
      <p>Tutorial agli effetti di «Sottomissioni in Suono»</p>
    </div>
    <nav class="chain" id="chain" aria-label="Passi del tutorial"></nav>
  </header>
  <main class="slide" id="slide" tabindex="-1"></main>
  <footer class="nav">
    <button type="button" id="prev">◀ Indietro</button>
    <div class="nav-mid"><span id="pos"></span><span class="playing" id="playing" aria-live="polite"></span></div>
    <div class="nav-right">
      <button type="button" id="stopAll">Ferma audio</button>
      <button type="button" id="next" class="primary">Ho capito, avanti ▶</button>
    </div>
  </footer>
</div>

<script id="engine" type="javascript/worker">
// Motore di sintesi: stesso modello di lab.html e sonify.py.
const SINN = 8192, SIN = new Float32Array(SINN + 1);
for (let i = 0; i <= SINN; i++) SIN[i] = Math.sin(2 * Math.PI * i / SINN);
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function boxPass(src, dst, r) {
  const n = src.length, w = 2 * r + 1; let acc = 0;
  for (let j = -r; j <= r; j++) acc += src[Math.min(n - 1, Math.max(0, j))];
  for (let i = 0; i < n; i++) { dst[i] = acc / w; acc += src[Math.min(n - 1, i + r + 1)] - src[Math.max(0, i - r)]; }
}
function smooth(a, sigma) {
  if (sigma < 1) return a;
  const r = Math.floor(Math.round(Math.sqrt(4 * sigma * sigma + 1)) / 2);
  let A = a, B = new Float32Array(a.length);
  for (let k = 0; k < 3; k++) { boxPass(A, B, r); const t = A; A = B; B = t; }
  return A;
}
// s(t): costante, rampa lineare o curva dai valori annuali (interpolata, smussata, elevata a gamma)
function sCurve(spec, n, sr) {
  let s = new Float32Array(n);
  if (spec.type === "const") s.fill(spec.v);
  else if (spec.type === "ramp") { for (let i = 0; i < n; i++) s[i] = spec.from + (spec.to - spec.from) * i / Math.max(1, n - 1); }
  else {
    const v = spec.values, NY = v.length, spy = spec.spy;
    for (let i = 0; i < n; i++) {
      const ty = i / sr / spy - 0.5, k = Math.floor(ty);
      s[i] = ty <= 0 ? v[0] : k >= NY - 1 ? v[NY - 1] : v[k] + (v[k + 1] - v[k]) * (ty - k);
    }
    s = smooth(s, 0.25 * spy * sr);
    for (let i = 0; i < n; i++) s[i] = Math.pow(Math.max(0, s[i]), spec.gamma);
  }
  return s;
}
function render(job) {
  const sr = job.sr, n = Math.max(1, Math.round(job.dur * sr));
  const L = new Float32Array(n), R = new Float32Array(n);
  const rng = mulberry32(job.seed || 7);
  const gauss = () => { let u = 0; while (u === 0) u = rng(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * rng()); };
  const fx = job.fx, NP = job.partials, nyq = 0.45 * sr, TWO_PI = 2 * Math.PI, BS = 32, nb = Math.ceil(n / BS);
  const TB = 4096, table = new Float32Array(TB);
  for (let k = 1; k <= NP; k++) { const a = Math.pow(k, -2.2); for (let i = 0; i < TB; i++) table[i] += a * Math.sin(TWO_PI * k * i / TB); }
  let tm = 0; for (let i = 0; i < TB; i++) tm = Math.max(tm, Math.abs(table[i])); for (let i = 0; i < TB; i++) table[i] /= tm || 1;

  for (const vc of job.voices) {
    const s = sCurve(vc.s, n, sr);
    const gl = Math.sqrt((1 - vc.pan) / 2), gr = Math.sqrt((1 + vc.pan) / 2);
    let x = null;
    if (vc.note !== false) {
      const sC = new Float32Array(nb + 1), fC = new Float32Array(nb + 1);
      for (let b = 0; b <= nb; b++) sC[b] = s[Math.min(n - 1, b * BS)];
      let jn = null;
      if (fx.jitter > 0) {
        jn = new Float32Array(nb + 1); for (let b = 0; b <= nb; b++) jn[b] = gauss();
        jn = smooth(jn, 0.03 * sr / BS);
        let m = 0; for (let b = 0; b <= nb; b++) m = Math.max(m, Math.abs(jn[b]));
        for (let b = 0; b <= nb; b++) jn[b] /= m || 1;
      }
      for (let b = 0; b <= nb; b++) {
        let c = vc.dir * fx.detune * sC[b]; if (jn) c += fx.jitter * jn[b] * sC[b];
        fC[b] = vc.f0 * Math.pow(2, c / 1200);
      }
      const B = fx.inharm / 1000, T = fx.bright;
      x = new Float32Array(n);
      for (let k = 1; k <= NP; k++) {
        let ph = rng(); const k2 = k * k, lk = Math.log(k), base = Math.pow(k, -2.2);
        const gate = b => job.buildup ? Math.max(0, Math.min(1, (b * BS / sr - (k - 1) * job.buildup) / 0.06)) : 1;
        const fkAt = b => B > 0 ? k * fC[b] * Math.sqrt(1 + B * sC[b] * k2) : k * fC[b];
        const ampAt = (b, fk) => fk >= nyq ? 0 : (T > 0 ? base * Math.exp(T * sC[b] * lk) : base) * gate(b);
        let fa = fkAt(0), aa = ampAt(0, fa);
        for (let b = 0; b < nb; b++) {
          const fb = fkAt(b + 1), ab = ampAt(b + 1, fb);
          const i0 = b * BS, i1 = Math.min(n, i0 + BS), len = i1 - i0;
          if (aa === 0 && ab === 0) { ph += (fa + fb) / 2 / sr * len; ph -= Math.floor(ph); fa = fb; aa = ab; continue; }
          let inc = fa / sr, amp = aa; const dinc = (fb - fa) / sr / len, damp = (ab - aa) / len;
          for (let i = i0; i < i1; i++) {
            const p = ph * SINN, j = p | 0;
            x[i] += amp * (SIN[j] + (SIN[j + 1] - SIN[j]) * (p - j));
            ph += inc; if (ph >= 1) ph -= 1; inc += dinc; amp += damp;
          }
          fa = fb; aa = ab;
        }
      }
      let m = 0; for (let i = 0; i < n; i++) m = Math.max(m, Math.abs(x[i])); m = m || 1;
      for (let i = 0; i < n; i++) {
        let v = x[i] / m;
        if (fx.fold > 0) { const si = s[i]; v = (1 - si) * v + si * Math.sin(Math.PI / 2 * (1 + fx.fold * si) * v); }
        if (job.breath) { const sn = Math.sin(TWO_PI * 0.11 * i / sr + vc.f0); v *= 0.6 + 0.4 * sn * sn; }
        x[i] = v;
      }
    }
    let gph = 0; const ginc = vc.f0 / sr * TB, gv = vc.ghost || 0;
    for (let i = 0; i < n; i++) {
      let v = x ? x[i] : 0;
      if (gv > 0) { const gi = gph | 0, gf = gph - gi; v += gv * (table[gi] + (table[(gi + 1) % TB] - table[gi]) * gf); gph += ginc; if (gph >= TB) gph -= TB; }
      L[i] += v * gl; R[i] += v * gr;
    }
  }
  let peak = 0; for (let i = 0; i < n; i++) peak = Math.max(peak, Math.abs(L[i]), Math.abs(R[i]));
  const g = peak > 0 ? 0.85 / peak : 0;
  for (let i = 0; i < n; i++) { L[i] *= g; R[i] *= g; }
  if (job.beat && job.beat.vol > 0) {
    const bt = job.beat, len = Math.round(0.3 * sr), NY = Math.round(job.dur / bt.spy);
    for (let y = 0; y < NY; y++) {
      const accent = bt.accent && (2006 + y) % 5 === 0, st = Math.round(y * bt.spy * sr), a = bt.vol * (accent ? 0.9 : 0.5);
      for (let j = 0; j < len && st + j < n; j++) {
        const t = j / sr;
        let v = 0.7 * Math.sin(TWO_PI * 1250 * t) * Math.exp(-t / 0.010) + 0.35 * Math.sin(TWO_PI * 2780 * t) * Math.exp(-t / 0.006);
        if (accent) v += 0.9 * Math.sin(TWO_PI * 62 * t) * Math.exp(-t / 0.09);
        L[st + j] += v * a; R[st + j] += v * a;
      }
    }
    let pk = 0; for (let i = 0; i < n; i++) pk = Math.max(pk, Math.abs(L[i]), Math.abs(R[i]));
    if (pk > 0.98) { const k = 0.98 / pk; for (let i = 0; i < n; i++) { L[i] *= k; R[i] *= k; } }
  }
  const fe = Math.min(n >> 1, Math.round(0.015 * sr));
  for (let i = 0; i < fe; i++) { const w = i / fe; L[i] *= w; R[i] *= w; L[n - 1 - i] *= w; R[n - 1 - i] *= w; }
  return { L, R, sr };
}
self.onmessage = e => {
  const r = render(e.data.job);
  self.postMessage({ id: e.data.id, L: r.L, R: r.R, sr: r.sr }, [r.L.buffer, r.R.buffer]);
};
</script>

<script>
(function () {
"use strict";
// ---------------- dati e valori predefiniti (uguali a lab.html) ----------------
const YEARS = []; for (let y = 2006; y <= 2025; y++) YEARS.push(y);
const DATA = {
  ICSE: [395,334,371,405,380,441,408,461,496,452,530,415,502,529,617,615,691,780,1049,1150],
  FSE:  [125,251,152,217,169,203,201,251,273,291,266,295,295,303,360,407,449,465,474,515],
  ASE:  [121,312,280,220,190,252,138,254,276,289,284,367,386,448,395,440,531,633,587,1181]
};
const NAMES = ["ICSE", "FSE", "ASE"];
const CHORD = { ICSE: { f0: 110, pan: -0.7, dir: -1 }, FSE: { f0: 165, pan: 0, dir: 1 }, ASE: { f0: 220, pan: 0.7, dir: 1 } };
const DEF = { sr: 44100, partials: 28, f0: 220, ghost: 0.35, threshold: 1.25, saturate: 1.4, gamma: 1.3, satMode: "common", spy: 1, beat: 0.5, accent: true, breath: false,
  fx: { detune: 90, jitter: 20, inharm: 2.5, bright: 1.2, fold: 5 } };
const NOFX = { detune: 0, jitter: 0, inharm: 0, bright: 0, fold: 0 };

  return v.map(x => Math.min(1, Math.max(0, (x / norm - o.threshold) / sat)));

const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function el(tag, attrs = {}, kids = []) {

    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v);

let uid = 0;
function slider(parent, o) {

// ---------------- motore audio ----------------
const worker = new Worker(URL.createObjectURL(new Blob([document.getElementById("engine").textContent], { type: "text/javascript" })));
let jobSeq = 0; const pending = new Map();
worker.onmessage = e => { const r = pending.get(e.data.id); pending.delete(e.data.id); if (r) r(e.data); };
const synth = job => new Promise(res => { const id = ++jobSeq; pending.set(id, res); worker.postMessage({ id, job: Object.assign({ sr: DEF.sr }, job) }); });
// una voce: nota (f0, direzione, panorama) con s costante, rampa o curva annuale
const voice = (o = {}) => Object.assign({ f0: DEF.f0, dir: 1, pan: 0, ghost: 0, s: { type: "const", v: 0 } }, o);

let actx = null, src = null, t0 = 0, dur = 0, onProg = null, raf = 0, token = 0;
const playingEl = document.getElementById("playing");
function ensureCtx() { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); }
function stopAudio() {
  token++;
  if (src) { const s = src; src = null; try { s.stop(); } catch (e) {} }
  cancelAnimationFrame(raf); playingEl.textContent = "";
  if (onProg) { const f = onProg; onProg = null; f(null); }
}
// clips: lista di job; vengono calcolati, concatenati con una breve pausa e suonati
async function playJobs(jobs, label, progress) {
  ensureCtx(); stopAudio();
  const my = token; playingEl.textContent = "Calcolo…";
  const clips = await Promise.all(jobs.map(synth));
  if (my !== token) return;
  const sr = clips[0].sr, gap = Math.round(0.35 * sr);
  const total = clips.reduce((a, c) => a + c.L.length, 0) + gap * (clips.length - 1);
  const buf = actx.createBuffer(2, total, sr), l = buf.getChannelData(0), r = buf.getChannelData(1);
  let o = 0; const marks = [];
  for (const c of clips) { l.set(c.L, o); r.set(c.R, o); marks.push([o / sr, (o + c.L.length) / sr]); o += c.L.length + gap; }
  const node = actx.createBufferSource(); node.buffer = buf; node.connect(actx.destination);
  node.onended = () => { if (src === node) { src = null; cancelAnimationFrame(raf); playingEl.textContent = ""; if (onProg) { const f = onProg; onProg = null; f(null); } } };
  node.start(); src = node; t0 = actx.currentTime; dur = total / sr; onProg = progress || null;
  playingEl.textContent = "▶ " + label;
  const tick = () => {
    if (src !== node) return;
    const t = actx.currentTime - t0;
    if (onProg) { const i = marks.findIndex(([a, b]) => t >= a && t <= b); onProg(i < 0 ? null : { clip: i, frac: (t - marks[i][0]) / (marks[i][1] - marks[i][0]), t }); }
    raf = requestAnimationFrame(tick);
  };
  raf = requestAnimationFrame(tick);
}

// ---------- strumenti per le slide sulla nota: parziali, spettro, forma d'onda ----------
const NOTES = [[110, "La2 · 110 Hz"], [146.83, "Re3 · 147 Hz"], [220, "La3 · 220 Hz"], [293.66, "Re4 · 294 Hz"]];
const PHASE = k => (k * 2.399963) % (2 * Math.PI);
// parziali della nota per un valore di s (senza jitter, che è casuale)
function partialsOf(o) {
  const fx = Object.assign({}, NOFX, o.fx), s = o.s || 0;
  const f = o.f0 * Math.pow(2, (o.dir || 1) * fx.detune * s / 1200), B = fx.inharm / 1000, out = [];
  for (let k = 1; k <= o.N; k++) {
    const fk = k * f * Math.sqrt(1 + B * s * k * k);
    if (fk >= 0.45 * DEF.sr) break;
    out.push({ k, f: fk, a: Math.pow(k, -2.2 + fx.bright * s) });
  }
  return out;
}
// un periodo della nota armonica (con tilt), normalizzato e poi ripiegato come nel motore
function cycleOf(o, n = 600, foldOn = true) {
  const fx = Object.assign({}, NOFX, o.fx), s = o.s || 0;
  const ps = partialsOf({ f0: o.f0, N: o.N, s, fx: { bright: fx.bright } });
  const x = new Float32Array(n); let m = 0;
  for (let i = 0; i < n; i++) { const th = 2 * Math.PI * i / n; let v = 0; for (const p of ps) v += p.a * Math.sin(p.k * th + PHASE(p.k)); x[i] = v; m = Math.max(m, Math.abs(v)); }
  for (let i = 0; i < n; i++) {
    let v = x[i] / (m || 1);
    if (foldOn && fx.fold > 0) v = (1 - s) * v + s * Math.sin(Math.PI / 2 * (1 + fx.fold * s) * v);
    x[i] = v;
  }
  return x;
}
// ampiezze armoniche di un periodo (DFT), in dB rispetto al massimo
function harmonicsOf(cyc, K = 60) {
  const n = cyc.length, out = [];
  for (let k = 1; k <= K; k++) { let re = 0, im = 0; for (let i = 0; i < n; i++) { const th = 2 * Math.PI * k * i / n; re += cyc[i] * Math.cos(th); im -= cyc[i] * Math.sin(th); } out.push(2 * Math.hypot(re, im) / n); }
  return out;
}
const db = a => 20 * Math.log10(Math.max(a, 1e-9));
function niceFreqTicks(fmax) { const step = fmax > 6000 ? 2000 : fmax > 2500 ? 1000 : 500; const t = []; for (let f = 0; f <= fmax; f += step) t.push(f); return t; }
function drawSpectrum(ctx, w, h, o) {
  const dbMin = o.dbMin ?? -70, ref = o.ref ?? 1;
  const a = axes(ctx, w, h, { x0: 0, x1: o.fmax, y0: dbMin, y1: 0, yTicks: [0, -20, -40, -60].filter(v => v >= dbMin), yFmt: v => v + " dB",
    xTicks: niceFreqTicks(o.fmax), xFmt: f => f >= 1000 ? (f / 1000) + "k" : String(f), xLabel: "Hz", m: { l: 54 } });
  if (o.grid) { ctx.strokeStyle = css("--line"); ctx.setLineDash([2, 3]); for (const f of o.grid) { if (f > o.fmax) break; ctx.beginPath(); ctx.moveTo(a.X(f), a.m.t); ctx.lineTo(a.X(f), h - a.m.b); ctx.stroke(); } ctx.setLineDash([]); }
  const stems = (parts, color, width, dot) => {
    ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = width;
    for (const p of parts) { if (p.f > o.fmax) continue; const y = a.Y(Math.max(dbMin, db(p.a / ref))); ctx.beginPath(); ctx.moveTo(a.X(p.f), a.Y(dbMin)); ctx.lineTo(a.X(p.f), y); ctx.stroke(); if (dot) { ctx.beginPath(); ctx.arc(a.X(p.f), y, 2.6, 0, 7); ctx.fill(); } }
  };
  if (o.ghost) stems(o.ghost, css("--ghost"), 3, false);
  stems(o.parts, css("--accent"), 1.5, true);
  ctx.lineWidth = 1;
  return a;
}
function drawWave(ctx, w, h, o) {
  const periods = o.periods || 2, ms = 1000 / o.f0;
  const a = axes(ctx, w, h, { x0: 0, x1: periods * ms, y0: -1.1, y1: 1.1, yTicks: [-1, 0, 1], xTicks: Array.from({ length: periods + 1 }, (_, i) => i * ms),
    xFmt: v => fmtN(v, 1) + " ms", m: { l: 30 } });
  const line = (cyc, color, width) => {
    ctx.strokeStyle = color; ctx.lineWidth = width; ctx.beginPath(); const n = cyc.length;
    for (let i = 0; i <= n * periods; i++) { const x = a.X(i / n * ms), y = a.Y(cyc[i % n]); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    ctx.stroke();
  };
  if (o.before) line(o.before, css("--ghost"), 1.5);
  line(o.cyc, css("--accent"), 2); ctx.lineWidth = 1;
}

addSlide({
  id: "nota", chain: "Nota", kicker: "Passo 2 · Sorgente",
  title: "La nota di partenza è una somma di parziali",
  text: `
    <p>Ogni suono periodico può essere scomposto in una somma di sinusoidi (serie di Fourier). Ogni sinusoide è una <b>parziale</b>, con una frequenza e un'ampiezza. Lo <b>spettro</b> è il grafico che mostra, per ogni frequenza, l'ampiezza della parziale corrispondente.</p>
    <p>La nota di partenza è <b>armonica</b>: la parziale k ha frequenza esattamente k · f₀, multiplo intero della <b>fondamentale</b> f₀. Le parziali armoniche si fondono e l'orecchio percepisce una sola nota, con altezza f₀. Il numero di parziali e le loro ampiezze determinano il <b>timbro</b>.</p>
    <div class="formula">
      <div>x(t) = Σₖ Aₖ · sin(2π · k · f₀ · t + φₖ),   k = 1 … N</div>
      <div>Aₖ = k^−2,2   (−13,2 dB per ottava)</div>
    </div>
    <p>Con Aₖ = k<sup>−2,2</sup> l'ampiezza scende rapidamente: la 10ª parziale è 44 dB sotto la fondamentale. Il timbro è scuro e morbido. Con N = 28 ci sono abbastanza parziali perché gli effetti successivi abbiano materiale su cui agire. Le parziali sopra il 45% della frequenza di campionamento (circa 19,8 kHz) vengono scartate, per evitare aliasing.</p>
    <p>Le fasi φₖ sono casuali e fisse. Non cambiano l'altezza né il timbro percepito, ma evitano che tutte le parziali raggiungano il picco nello stesso istante.</p>
    <p>Tutti gli effetti dei passi successivi modificano questa somma: l'altezza f₀ (detune, jitter), la posizione delle parziali (inarmonicità), la loro ampiezza (spectral tilt) e la forma d'onda risultante (wavefolding).</p>
    <div class="listen"><b>Cosa ascoltare</b><p>La sola fondamentale è una sinusoide: suono puro, senza timbro. Aggiungendo parziali il suono diventa più pieno, ma l'altezza percepita resta la stessa. Nella costruzione progressiva le prime parziali cambiano molto il timbro, le ultime poco, perché sono molto più deboli.</p></div>`,
  build(lab) {
    const o = { N: DEF.partials, f0: DEF.f0 };
    lab.append(el("p", { class: "lab-title", text: "Esperimento" }));
    const ctls = el("div", { class: "ctls" }); lab.append(ctls);
    slider(ctls, { label: "Parziali N", min: 1, max: 40, step: 1, value: o.N, fmt: v => String(v), onInput: v => { o.N = v; redraw(); } });
    seg(ctls, { label: "Fondamentale f₀", options: NOTES, value: o.f0, onChange: v => { o.f0 = v; redraw(); } });
    const spec = plot(lab, 200, (ctx, w, h) => drawSpectrum(ctx, w, h, { parts: partialsOf({ f0: o.f0, N: o.N }), fmax: Math.min(12000, Math.max(1500, o.f0 * o.N * 1.05)) }),
      "Spettro: ogni linea è una parziale, a k · f₀. L'altezza è l'ampiezza in dB rispetto alla fondamentale.");
    const wave = plot(lab, 130, (ctx, w, h) => drawWave(ctx, w, h, { f0: o.f0, cyc: cycleOf({ f0: o.f0, N: o.N }) }), "Forma d'onda: due periodi della somma.");
    const ro = el("div", { class: "readout" }); lab.append(ro);
    function redraw() {
      spec.redraw(); wave.redraw();
      const ps = partialsOf({ f0: o.f0, N: o.N }), last = ps[ps.length - 1];
      ro.innerHTML = `<div><span>fondamentale:</span> ${fmtN(o.f0, 2)} Hz · periodo ${fmtN(1000 / o.f0, 2)} ms</div>
        <div><span>parziale più alta:</span> k = ${last.k}, ${fmtN(last.f, 0)} Hz, ${fmtN(db(last.a), 1)} dB</div>`;
    }
    redraw();
    const job = (N, extra = {}) => Object.assign({ dur: 2.5, partials: N, fx: NOFX, voices: [voice({ f0: o.f0 })] }, extra);
    plays(lab, [
      { label: "Solo fondamentale (N = 1)", onClick: () => playJobs([job(1)], "Sinusoide alla fondamentale") },
      { label: "Nota con N parziali", primary: true, onClick: () => playJobs([job(o.N)], `Nota armonica, ${o.N} parziali`) },
      { label: "Costruzione: una parziale ogni 0,2 s", onClick: () => playJobs([job(o.N, { dur: o.N * 0.2 + 1.5, buildup: 0.2 })], "Aggiunta progressiva delle parziali") }
    ]);
  }
});

// ---------- slide di un effetto: una nota, un solo effetto attivo ----------
// def.visual(lab, st, sv) crea i grafici e restituisce le funzioni di ridisegno; sv() è la s mostrata
function effectSlide(def) {
  addSlide({
    id: def.id, chain: def.chain, kicker: def.kicker, title: def.title, text: def.text,
    build(lab) {
      const st = { s: 0.6, depth: def.depth.value, f0: DEF.f0, ghost: def.ghost ?? DEF.ghost, live: null };
      const sv = () => st.live ?? st.s;
      lab.append(el("p", { class: "lab-title", text: `Esperimento · solo ${def.chain}` }));
      const ctls = el("div", { class: "ctls" }); lab.append(ctls);
      const sS = slider(ctls, { label: "Stranezza s", cls: "s-ctl", min: 0, max: 1, step: 0.01, value: st.s, fmt: v => fmtN(v), onInput: v => { st.s = v; redraw(); },
        help: "In ogni istante l'effetto vale profondità × s." });
      slider(ctls, Object.assign({}, def.depth, { onInput: v => { st.depth = v; redraw(); } }));
      slider(ctls, { label: "Volume voce fantasma", min: 0, max: 1, step: 0.05, value: st.ghost, fmt: v => v ? Math.round(v * 100) + "%" : "spenta", onInput: v => { st.ghost = v; redraw(); },
        help: "La stessa nota senza effetti, ferma a f₀: il riferimento." });
      seg(ctls, { label: "Fondamentale f₀", options: NOTES, value: st.f0, onChange: v => { st.f0 = v; redraw(); } });
      const draws = def.visual(lab, st, sv);
      const ro = el("div", { class: "readout" }); lab.append(ro);
      function redraw() { draws.forEach(d => d.redraw()); ro.innerHTML = `<div><span>s =</span> ${fmtN(sv())}${st.live != null ? " (rampa in corso)" : ""}</div>` + def.readout(st, sv()); }
      redraw();
      const fx = () => Object.assign({}, NOFX, { [def.key]: st.depth });
      const job = (s, d = 2.5, extra = {}) => Object.assign({ dur: d, partials: DEF.partials, fx: fx(), voices: [voice({ f0: st.f0, ghost: st.ghost, s })] }, extra);
      const C = v => ({ type: "const", v });
      plays(lab, [
        { label: "Nota pulita (s = 0)", onClick: () => playJobs([job(C(0))], "Nota pulita") },
        { label: "Con l'effetto (s scelta)", primary: true, onClick: () => playJobs([job(C(st.s))], `${def.chain}, s = ${fmtN(st.s)}`) },
        { label: "A/B: pulita, poi con l'effetto", onClick: () => playJobs([job(C(0)), job(C(st.s))], `A: pulita · B: ${def.chain} con s = ${fmtN(st.s)}`) },
        { label: "Rampa: s da 0 a 1 in 6 s", onClick: () => playJobs([job({ type: "ramp", from: 0, to: 1 }, 6)], `${def.chain}, rampa di s`, p => { st.live = p ? p.frac : null; redraw(); }) },
        { label: "Solo voce fantasma", onClick: () => playJobs([{ dur: 2.5, partials: DEF.partials, fx: NOFX, voices: [voice({ f0: st.f0, ghost: 1, note: false })] }], "Voce fantasma") }
      ]);
      sS.input.addEventListener("input", () => { st.live = null; });
    }
  });
}

effectSlide({
  id: "detune", key: "detune", chain: "Detune", kicker: "Passo 3 · Altezza",
  title: "Detune: spostare l'altezza della nota",
  depth: { label: "Profondità D", min: 0, max: 200, step: 5, value: DEF.fx.detune, fmt: v => `${v} cent` },
  text: `
    <p>Il detune sposta la frequenza fondamentale, e con lei tutte le parziali, di una quantità misurata in <b>cent</b>. 100 cent sono un semitono, 1200 cent un'ottava. La scala è logaritmica perché lo è la percezione dell'altezza: lo stesso numero di cent suona come lo stesso intervallo a qualunque frequenza.</p>
    <div class="formula">
      <div>Δc(t) = dir · D · s(t)</div>
      <div>f(t) = f₀ · 2^(Δc(t) / 1200)</div>
    </div>
    <p>D è la profondità (predefinita 90 cent, poco meno di un semitono). dir vale −1 o +1. Nell'accordo ICSE scende e FSE e ASE salgono, così le note si allontanano tra loro e l'accordo si deforma invece di trasporsi in blocco. Nella nota singola dir = +1.</p>
    <h3>Perché si percepisce: i battimenti</h3>
    <p>Una nota spostata, ascoltata da sola, sembra soltanto un'altra nota. Lo spostamento diventa percepibile come errore quando c'è un riferimento, cioè la voce fantasma ferma a f₀. Due sinusoidi di frequenze vicine f e f₀ si sommano in un suono la cui ampiezza oscilla con frequenza |f − f₀|: è il <b>battimento</b>.</p>
    <p>La parziale k batte a k · |f − f₀|. Le parziali alte battono quindi più velocemente delle basse. Quando il battimento supera circa 15–20 Hz non si sente più come pulsazione, ma come <b>ruvidità</b> (rugosità). Oltre circa un semitono le due note si separano e si sentono come un intervallo dissonante.</p>
    <div class="listen"><b>Cosa ascoltare</b><p>Con s basso: una pulsazione lenta e regolare del volume. Al crescere di s la pulsazione accelera e diventa ruvidità, prima nelle parziali acute. Senza voce fantasma lo spostamento è molto meno evidente: prova a metterla a 0.</p></div>`,
  visual(lab, st, sv) {
    const pos = plot(lab, 86, (ctx, w, h) => {
      const R = 220, c = sv() * st.depth;
      const a = axes(ctx, w, h, { x0: -R, x1: R, y0: 0, y1: 1, xTicks: [-200, -100, 0, 100, 200], xFmt: v => (v > 0 ? "+" : "") + v + " cent", m: { l: 16, r: 16, t: 8, b: 26 } });
      const mark = (x, color, label, up) => { ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(a.X(x), a.Y(0.1)); ctx.lineTo(a.X(x), a.Y(0.85)); ctx.stroke(); ctx.textAlign = "center"; ctx.textBaseline = up ? "bottom" : "top"; ctx.fillText(label, a.X(x), up ? a.Y(0.86) : a.Y(0.1) + 2); ctx.lineWidth = 1; };
      mark(0, css("--ghost"), "fantasma", true);
      mark(Math.min(R, c), css("--accent"), `nota ${c >= 0 ? "+" : ""}${Math.round(c)}`, false);
    }, "Posizione della nota rispetto al fantasma, in cent (100 cent = un semitono).");
    const env = plot(lab, 150, (ctx, w, h) => {
      const f = st.f0 * Math.pow(2, sv() * st.depth / 1200), df = Math.abs(f - st.f0), g = st.ghost;
      const a = axes(ctx, w, h, { x0: 0, x1: 2, y0: 0, y1: 1.4, yTicks: [0, 1], xTicks: [0, 0.5, 1, 1.5, 2], xFmt: v => fmtN(v, 1) + " s", yLabel: "ampiezza" });
      const curve = (k, color) => { ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.beginPath(); for (let i = 0; i <= 600; i++) { const t = i / 300; const e = Math.sqrt(1 + g * g + 2 * g * Math.cos(2 * Math.PI * k * df * t)); const y = a.Y(e); i ? ctx.lineTo(a.X(t), y) : ctx.moveTo(a.X(t), y); } ctx.stroke(); ctx.lineWidth = 1; };
      curve(10, css("--ghost")); curve(1, css("--accent"));
    }, "Inviluppo della somma nota + fantasma: 1ª parziale (colore) e 10ª parziale (grigio). Ogni ondulazione è un battimento.");
    return [pos, env];
  },
  readout(st, s) {
    const c = s * st.depth, f = st.f0 * Math.pow(2, c / 1200), df = Math.abs(f - st.f0);
    return `<div><span>Δc = D · s =</span> ${fmtN(c, 1)} cent</div>
      <div><span>f =</span> ${fmtN(f, 2)} Hz <span>(f₀ = ${fmtN(st.f0, 2)} Hz)</span></div>
      <div><span>battimento 1ª parziale:</span> ${fmtN(df, 2)} Hz · <span>10ª parziale:</span> ${fmtN(10 * df, 1)} Hz</div>`;
  }
});

// rumore gaussiano filtrato come nel motore (passo di 1 ms), normalizzato tra −1 e 1
function jitterNoise(ms, seed = 3) {
  let a = seed; const rnd = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  let x = Array.from({ length: ms }, () => { let u = 0; while (!u) u = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * rnd()); });
  const r = Math.floor(Math.round(Math.sqrt(4 * 30 * 30 + 1)) / 2);
  for (let p = 0; p < 3; p++) { const y = x.map((_, i) => { let s = 0; for (let j = -r; j <= r; j++) s += x[Math.min(ms - 1, Math.max(0, i + j))]; return s / (2 * r + 1); }); x = y; }
  const m = Math.max(...x.map(Math.abs)) || 1;
  return x.map(v => v / m);
}

effectSlide({
  id: "jitter", key: "jitter", chain: "Jitter", kicker: "Passo 4 · Altezza",
  title: "Jitter: un'altezza che non resta ferma",
  depth: { label: "Profondità J", min: 0, max: 60, step: 1, value: DEF.fx.jitter, fmt: v => `±${v} cent` },
  text: `
    <p>Il jitter aggiunge allo spostamento del detune una deviazione casuale e continua dell'altezza. Nel calcolo i due termini si sommano, prima di costruire le parziali:</p>
    <div class="formula">
      <div>Δc(t) = dir · D · s(t) + J · s(t) · n(t)</div>
      <div>f(t) = f₀ · 2^(Δc(t) / 1200)</div>
    </div>
    <p>n(t) è rumore gaussiano filtrato passa-basso (tre medie mobili, equivalenti a un filtro gaussiano con deviazione standard di 30 ms) e normalizzato tra −1 e +1. Il filtro rende la deviazione continua: l'altezza scivola, senza salti. J è la profondità (predefinita ±20 cent).</p>
    <p>Il jitter si distingue dal <b>vibrato</b>. Il vibrato è una modulazione periodica e regolare (tipicamente 5–7 Hz) ed è percepito come espressivo. Il jitter non ha periodo: l'altezza vaga senza schema, e questo viene percepito come instabilità o mancanza di controllo.</p>
    <p>Rispetto alla voce fantasma, il jitter rende i battimenti irregolari: accelerano, rallentano e cambiano continuamente. In frequenza la deviazione è piccola (±20 cent a 220 Hz sono circa ±2,5 Hz). Per questo nello spettrogramma del tool il jitter quasi non si vede, ma si sente.</p>
    <p>In questa slide il detune è spento, quindi il jitter oscilla attorno a f₀. Nel brano completo oscilla attorno alla nota già spostata dal detune.</p>
    <div class="listen"><b>Cosa ascoltare</b><p>Con s alto la nota «galleggia»: l'intonazione si sposta di continuo, senza ritmo. Con la voce fantasma accesa, la pulsazione del battimento cambia velocità da un istante all'altro.</p></div>`,
  visual(lab, st, sv) {
    const noise = jitterNoise(3000);
    const p = plot(lab, 190, (ctx, w, h) => {
      const amp = st.depth * sv(), Y = 65;
      const a = axes(ctx, w, h, { x0: 0, x1: 3, y0: -Y, y1: Y, yTicks: [-60, -30, 0, 30, 60], yFmt: v => (v > 0 ? "+" : "") + v, xTicks: [0, 1, 2, 3], xFmt: v => v + " s", yLabel: "cent" });
      ctx.strokeStyle = css("--ghost"); ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(a.X(0), a.Y(0)); ctx.lineTo(a.X(3), a.Y(0)); ctx.stroke();
      ctx.strokeStyle = css("--accent"); ctx.lineWidth = 2; ctx.beginPath();
      noise.forEach((v, i) => { const x = a.X(i / 1000), y = a.Y(amp * v); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.stroke(); ctx.lineWidth = 1;
    }, "Esempio di andamento dell'altezza nel tempo (colore) rispetto al fantasma (grigio). Il rumore reale cambia a ogni ascolto.");
    return [p];
  },
  readout(st, s) {
    const c = st.depth * s;
    return `<div><span>deviazione massima J · s =</span> ±${fmtN(c, 1)} cent</div>
      <div><span>alla fondamentale:</span> ±${fmtN(st.f0 * (Math.pow(2, c / 1200) - 1), 2)} Hz · <span>alla 10ª parziale:</span> ±${fmtN(10 * st.f0 * (Math.pow(2, c / 1200) - 1), 1)} Hz</div>`;
  }
});

effectSlide({
  id: "inarmonicita", key: "inharm", chain: "Inarmonicità", kicker: "Passo 5 · Posizione delle parziali",
  title: "Inarmonicità: parziali fuori dalla serie armonica",
  depth: { label: "Coefficiente B", min: 0, max: 6, step: 0.1, value: DEF.fx.inharm, fmt: v => `${fmtN(v, 1)}‰` },
  text: `
    <p>Finora le parziali stavano esattamente a multipli interi di f₀. L'inarmonicità le sposta verso l'alto, tanto più quanto più alto è il loro numero k:</p>
    <div class="formula">
      <div>fₖ(t) = k · f(t) · √(1 + B · s(t) · k²)</div>
    </div>
    <p>È il modello fisico della <b>corda rigida</b>. Una corda reale ha una propria rigidità, che aumenta la frequenza dei modi di vibrazione più alti. Lo stesso fenomeno, in piccolo, fa sì che negli strumenti a corda percossa le parziali acute siano leggermente crescenti. B è il coefficiente di inarmonicità: con B = 2,5‰ e s = 1 la 2ª parziale sale dello 0,5%, la 10ª dell'11,8% (circa 2 semitoni), la 20ª del 41%.</p>
    <p>Lo spostamento cresce con k², quindi le prime parziali restano quasi al loro posto e quelle alte si allontanano molto. La distanza tra parziali vicine non è più costante.</p>
    <h3>Perché si percepisce</h3>
    <p>Il sistema uditivo raggruppa in una sola nota le parziali che stanno in rapporti interi, e assegna loro l'altezza della fondamentale. Quando i rapporti non sono più interi, il raggruppamento si indebolisce: l'altezza diventa ambigua e il timbro metallico. È il caso di campane, gong e piastre, i cui modi di vibrazione sono naturalmente inarmonici.</p>
    <p>Nello spettrogramma del tool questo effetto produce le creste che si curvano verso l'alto e si allargano a ventaglio negli ultimi anni.</p>
    <div class="listen"><b>Cosa ascoltare</b><p>La fondamentale resta ferma, ma sopra di lei compare una «nuvola» di componenti che non si fondono più con la nota. Con la rampa si sente il passaggio da una nota a un oggetto sonoro di altezza incerta.</p></div>`,
  visual(lab, st, sv) {
    const spec = plot(lab, 190, (ctx, w, h) => {
      const fmax = 5000, ghost = partialsOf({ f0: st.f0, N: DEF.partials });
      drawSpectrum(ctx, w, h, { fmax, grid: ghost.map(p => p.f), ghost, parts: partialsOf({ f0: st.f0, N: DEF.partials, s: sv(), fx: { inharm: st.depth } }) });
    }, "Grigio e linee tratteggiate: posizioni armoniche k · f₀. Colore: parziali con l'inarmonicità attuale.");
    const dev = plot(lab, 140, (ctx, w, h) => {
      const B = st.depth / 1000, s = sv(), K = DEF.partials, top = Math.max(10, Math.sqrt(1 + 0.006 * K * K) * 100 - 100);
      const a = axes(ctx, w, h, { x0: 0.5, x1: K + 0.5, y0: 0, y1: top, yTicks: [0, top / 2, top].map(v => Math.round(v)), yFmt: v => v + "%", xTicks: [1, 5, 10, 15, 20, 25], yLabel: "spostamento" });
      const bw = (a.X(1) - a.X(0)) * 0.7; ctx.fillStyle = css("--accent");
      for (let k = 1; k <= K; k++) { const d = (Math.sqrt(1 + B * s * k * k) - 1) * 100; ctx.fillRect(a.X(k) - bw / 2, a.Y(Math.min(top, d)), bw, a.Y(0) - a.Y(Math.min(top, d))); }
    }, "Spostamento di ogni parziale rispetto alla posizione armonica, in percentuale (asse x: numero k).");
    return [spec, dev];
  },
  readout(st, s) {
    const B = st.depth / 1000, d = k => Math.sqrt(1 + B * s * k * k), cents = k => 1200 * Math.log2(d(k));
    return `<div><span>B · s =</span> ${fmtN(B * s * 1000, 2)}‰</div>
      <div><span>2ª parziale:</span> +${fmtN((d(2) - 1) * 100, 1)}% · <span>10ª:</span> +${fmtN((d(10) - 1) * 100, 1)}% (+${Math.round(cents(10))} cent) · <span>20ª:</span> +${fmtN((d(20) - 1) * 100, 1)}%</div>`;
  }
});

let cur = 0;
function renderChain() {
  chainEl.textContent = "";
  SLIDES.forEach((s, i) => {
    if (i) chainEl.append(el("span", { class: "arrow", "aria-hidden": "true", text: "→" }));
    const b = el("button", { type: "button", text: s.chain, onclick: () => go(i) });
    if (done.has(s.id)) b.classList.add("done");
    if (i === cur) b.setAttribute("aria-current", "step");
    chainEl.append(b);
  });
}
function go(i) {
  i = Math.max(0, Math.min(SLIDES.length - 1, i));
  stopAudio(); cur = i;
  const s = SLIDES[i];
  slideEl.textContent = "";
  const text = el("article", { class: "text" }, [el("p", { class: "kicker", text: s.kicker }), el("h2", { text: s.title })]);
  text.insertAdjacentHTML("beforeend", s.text);
  const lab = el("section", { class: "lab", "aria-label": "Esperimento" });
  slideEl.append(text, lab);
  s.build(lab);
  posEl.textContent = `Passo ${i + 1} di ${SLIDES.length}`;
  prevBtn.disabled = i === 0;
  nextBtn.textContent = i === SLIDES.length - 1 ? "Ho capito ✓" : "Ho capito, avanti ▶";
  renderChain();
  if (location.hash !== "#" + s.id) history.replaceState(null, "", "#" + s.id);
  window.scrollTo({ top: 0 });
  slideEl.focus({ preventScroll: true });
}
prevBtn.addEventListener("click", () => go(cur - 1));
nextBtn.addEventListener("click", () => { done.add(SLIDES[cur].id); saveDone(); if (cur < SLIDES.length - 1) go(cur + 1); else renderChain(); });
document.addEventListener("keydown", e => {
  if (e.target.matches("input, select, textarea")) return;
  if (e.key === "ArrowRight") go(cur + 1); else if (e.key === "ArrowLeft") go(cur - 1);
});
window.addEventListener("hashchange", () => { const i = SLIDES.findIndex(s => "#" + s.id === location.hash); if (i >= 0 && i !== cur) go(i); });
const start = SLIDES.findIndex(s => "#" + s.id === location.hash);
go(start >= 0 ? start : 0);
})();
</script>
