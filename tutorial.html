<meta charset="utf-8">
<title>Off Key</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one slide per screen. On the left the idea (title, sentence, formula), on the right the experiment (one chart, the s knob, one play button). A progress bar above, two buttons below. */
:root {
  --bg: #f6f6fa;
  --surface: #ffffff;
  --ink: #15161f;
  --muted: #6b6f83;
  --faint: #a3a6b8;
  --line: #e7e8f0;
  --accent: #5a4ae0;
  --accent-ink: #ffffff;
  --accent-soft: #efedff;
  --ghost: #b9bccb;
  --icse: #d4473a;
  --fse: #13917f;
  --ase: #c47a0c;
  --good: #13917f;
  --font-display: "Space Grotesk", "Inter", system-ui, sans-serif;
  --font-text: "Inter", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d0e14; --surface: #15161f; --ink: #ececf3; --muted: #9094aa; --faint: #5d6178; --line: #252735;
    --accent: #a396ff; --accent-ink: #14122a; --accent-soft: #211e3c; --ghost: #4f5469;
    --icse: #ff6f61; --fse: #3fcab6; --ase: #f2aa3c; --good: #3fcab6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d0e14; --surface: #15161f; --ink: #ececf3; --muted: #9094aa; --faint: #5d6178; --line: #252735;
  --accent: #a396ff; --accent-ink: #14122a; --accent-soft: #211e3c; --ghost: #4f5469;
  --icse: #ff6f61; --fse: #3fcab6; --ase: #f2aa3c; --good: #3fcab6;
  color-scheme: dark;
}
* { box-sizing: border-box; }
/* hidden elements stay hidden even where a rule sets their display (e.g. canvases in the stage) */
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font: 15px/1.6 var(--font-text); -webkit-font-smoothing: antialiased;
  padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px));
  padding-block: 0;
}
.app { max-width: 1180px; margin: 0 auto; min-height: 100vh; display: grid; grid-template-rows: auto 1fr auto; }

/* top bar */
.top { display: grid; gap: 12px; padding-block: 20px 8px; }
.top-row { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
/* same links as at the top of the tool: home, and straight to the tool for readers who want to skip the tutorial */
.crumbs { display: flex; align-items: baseline; gap: 18px; font-size: 0.85rem; font-weight: 500; }
.crumbs a { color: var(--accent); text-decoration: none; }
.crumbs a.home { color: var(--ink); font: 600 0.95rem var(--font-display); letter-spacing: -0.01em; }
.crumbs a:hover { text-decoration: underline; text-underline-offset: 3px; }
.step-name { font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.progress { display: flex; gap: 4px; }
.progress button { flex: 1; height: 18px; border: 0; padding: 7px 0; background: none; cursor: pointer; }
.progress button::after { content: ""; display: block; height: 4px; border-radius: 2px; background: var(--line); transition: background 0.2s; }
.progress button.seen::after { background: var(--faint); }
.progress button[aria-current="step"]::after { background: var(--accent); }
.progress button:hover::after { background: var(--muted); }
.progress .rest { height: 4px; margin-top: 7px; border-radius: 2px; background: var(--line); opacity: 0.5; }
textarea.csv { width: 100%; min-height: 220px; font: 0.85rem/1.5 var(--font-mono); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; resize: vertical; }
textarea.csv:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.feedback.bad { color: var(--icse); }
.scale-note { font-size: 0.85rem; color: var(--muted); margin: -6px 0 0; max-width: 70ch; }
.data-note { font-size: 0.85rem; color: var(--muted); margin: 0; }
.quiz-status { font: 0.8rem/1.6 var(--font-mono); color: var(--muted); margin: 0; }
.quiz-status b { color: var(--ink); font-weight: 500; }
.top-right { display: flex; align-items: baseline; gap: 14px; }
.gloss-open { font: 500 0.82rem var(--font-text); color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
.term { color: var(--accent); text-decoration: underline dotted; text-underline-offset: 3px; }
.terms a.chip { text-decoration: none; }
.terms { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; max-width: 60ch; }
.terms > span { font: 500 0.72rem var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-right: 4px; }

/* slide */
.slide { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 56px; align-items: start; padding-block: 28px 32px; outline: none; }
@media (max-width: 940px) { .slide { grid-template-columns: minmax(0, 1fr); gap: 28px; padding-block: 16px 24px; } }
.idea { display: grid; gap: 18px; align-content: start; min-width: 0; }
.eyebrow { font: 500 0.75rem var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); margin: 0; }
.idea h2 { font: 600 clamp(1.9rem, 3.6vw, 2.7rem)/1.08 var(--font-display); letter-spacing: -0.03em; margin: 0; text-wrap: balance; }
.lead { font-size: 1.08rem; color: var(--muted); margin: 0; max-width: 46ch; }
.formula { font: 0.92rem/1.9 var(--font-mono); color: var(--ink); border-left: 2px solid var(--accent); padding-left: 14px; margin: 0; overflow-x: auto; white-space: nowrap; }
.hear { display: grid; gap: 2px; margin: 0; max-width: 46ch; }
.hear span { font: 500 0.72rem var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
details.more { border-top: 1px solid var(--line); padding-top: 12px; max-width: 60ch; }
details.more summary { cursor: pointer; font-weight: 500; font-size: 0.9rem; color: var(--muted); list-style: none; display: flex; align-items: center; gap: 8px; }
details.more summary::-webkit-details-marker { display: none; }
details.more summary::before { content: "+"; font: 500 1rem var(--font-mono); width: 14px; }
details.more[open] summary::before { content: "−"; }
details.more .body { padding-top: 10px; font-size: 0.92rem; }
details.more p { margin: 0 0 10px; }
details.more ul { margin: 0 0 10px; padding-left: 18px; }

/* experiment panel */
.tool { background: var(--surface); border-radius: 18px; padding: 22px; display: grid; gap: 18px; min-width: 0; box-shadow: 0 1px 2px rgba(20, 20, 40, 0.04), 0 8px 28px rgba(20, 20, 40, 0.05); }
.plot { width: 100%; display: block; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 28px; }
.stat { display: grid; gap: 0; }
.stat b { font: 500 1.35rem var(--font-mono); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.stat span { font-size: 0.75rem; color: var(--muted); }
.knob { display: grid; gap: 6px; }
.knob-head { display: flex; justify-content: space-between; align-items: baseline; }
.knob label { font-size: 0.85rem; color: var(--muted); }
.knob output { font: 500 0.9rem var(--font-mono); font-variant-numeric: tabular-nums; }
.knob.main label { color: var(--ink); font-weight: 600; }
.knob.main output { font-size: 1.1rem; color: var(--accent); }
.knobs { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px 24px; }
input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; background: transparent; margin: 0; cursor: pointer; }
input[type="range"]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: var(--line); }
input[type="range"]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--line); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--ink); margin-top: -6px; border: 0; }
input[type="range"]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--ink); border: 0; }
.knob.main input[type="range"]::-webkit-slider-thumb { background: var(--accent); width: 20px; height: 20px; margin-top: -8px; }
.knob.main input[type="range"]::-moz-range-thumb { background: var(--accent); width: 20px; height: 20px; }
input[type="range"]:disabled { opacity: 0.35; }
/* year ticks under a year slider: one per year, centred under the thumb (16px wide, so inset by 8px), the baseline years in the accent colour */
.ticks { position: relative; height: 22px; margin-top: -2px; font: 0.68rem var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.ticks i { position: absolute; top: 0; width: 1px; height: 5px; background: var(--line); transform: translateX(-50%); }
.ticks i.long { height: 8px; background: var(--muted); }
.ticks i.in { background: var(--accent); }
.ticks b { position: absolute; top: 9px; font-weight: 400; transform: translateX(-50%); white-space: nowrap; }
.ticks b.first { transform: translateX(-8px); }
.ticks b.last { transform: translateX(calc(-100% + 8px)); }
.ticks b.in { color: var(--accent); }

.listen { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.play { display: inline-flex; align-items: center; gap: 12px; border: 0; background: none; padding: 0; font: 600 0.95rem var(--font-text); color: var(--ink); cursor: pointer; }
.play i { width: 48px; height: 48px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; flex: none; transition: transform 0.15s; }
.play i::before { content: ""; border-left: 13px solid var(--accent-ink); border-top: 8px solid transparent; border-bottom: 8px solid transparent; margin-left: 3px; }
.play.on i::before { border: 0; width: 13px; height: 13px; background: var(--accent-ink); margin: 0; border-radius: 2px; }
.play:hover i { transform: scale(1.05); }
.play i { position: relative; }
.play.on i::after {
  content: ""; position: absolute; inset: -6px; border-radius: 50%;
  background: conic-gradient(var(--accent) calc(var(--p, 0) * 1turn), var(--line) 0);
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2.5px));
  mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2.5px));
}
.chip.on { background-image: linear-gradient(var(--accent-ink), var(--accent-ink)); background-repeat: no-repeat; background-position: left bottom; background-size: calc(var(--p, 0) * 100%) 2px; }
.playline { position: sticky; bottom: 0; height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; z-index: 6; }
.playline::before { content: ""; display: block; height: 100%; width: calc(var(--p, 0) * 100%); background: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 500 0.82rem var(--font-text); color: var(--muted); background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; cursor: pointer; }
.chip:hover { color: var(--ink); border-color: var(--faint); }
.chip.on, .chip[aria-pressed="true"] { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }
details.opts summary { cursor: pointer; font-size: 0.82rem; color: var(--muted); list-style: none; }
details.opts summary::-webkit-details-marker { display: none; }
details.opts summary::after { content: " ▾"; }
details.opts[open] summary::after { content: " ▴"; }
details.opts .knobs { padding-top: 12px; }
.knob-note { font-size: 0.85rem; color: var(--muted); margin: 10px 0 0; max-width: 72ch; }
.knob-note b { color: var(--ink); font-weight: 500; }
.opt-note { grid-column: 1 / -1; font-size: 0.82rem; color: var(--muted); margin: -8px 0 4px; max-width: 70ch; }
.opt-note b { color: var(--ink); font-weight: 500; }
.field { display: grid; gap: 6px; }
.field > span { font-size: 0.85rem; color: var(--muted); }
.divider { height: 1px; background: var(--line); }
.sub { font: 500 0.72rem var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 0; }
.feedback { font-size: 0.9rem; color: var(--muted); min-height: 1.6em; margin: 0; }
.chip.right { background: var(--good); border-color: var(--good); color: var(--accent-ink); }
.chip.wrong { border-color: var(--icse); color: var(--icse); }

/* chain diagram */
.chain { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.chain li { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 9px 0; position: relative; }
.chain li::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--surface); border: 2px solid var(--faint); justify-self: center; z-index: 1; }
.chain li::after { content: ""; position: absolute; left: 8px; top: 0; bottom: 0; width: 2px; background: var(--line); }
.chain li:first-child::after { top: 50%; } .chain li:last-child::after { bottom: 50%; }
.chain li.fx::before { border-color: var(--accent); }
.chain-note { font-size: 0.82rem; color: var(--muted); margin: -4px 0 0; }
.chain li b { font-weight: 500; }
.chain li small { font: 0.75rem var(--font-mono); color: var(--muted); }
.chain li em { font: normal 500 0.72rem var(--font-mono); color: var(--accent); }

table.map { border-collapse: collapse; width: 100%; font-size: 0.86rem; }
table.map td { padding: 7px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
table.map td + td { padding-left: 16px; color: var(--muted); }
.cta { display: inline-flex; align-items: center; gap: 10px; background: var(--accent); color: var(--accent-ink); text-decoration: none; font-weight: 600; padding: 14px 22px; border-radius: 999px; width: fit-content; }
.feat { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.feat li { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 10px; }
.feat li::before { content: "→"; color: var(--accent); }

/* bottom bar */
.bottom { position: sticky; bottom: 0; background: var(--bg); display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px calc(16px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); z-index: 5; }
.btn { font: 500 0.92rem var(--font-text); border-radius: 999px; padding: 10px 20px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.now { font: 0.78rem var(--font-mono); color: var(--accent); flex: 1; min-width: 0; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
button:focus-visible, input:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
@media (prefers-reduced-motion: no-preference) { .slide { animation: rise 0.35s ease-out; } @keyframes rise { from { opacity: 0; transform: translateY(6px); } } }
</style>

<div class="app">
  <header class="top">
    <div class="top-row">
      <nav class="crumbs" aria-label="Off Key"><a class="home" href="./">Off Key</a><a href="lab.html">Tool</a></nav>
      <span class="top-right"><span class="step-name" id="stepName"></span><a class="gloss-open" href="glossary.html">Glossary</a></span>
    </div>
    <nav class="progress" id="progress" aria-label="Tutorial steps"></nav>
  </header>
  <main class="slide" id="slide" tabindex="-1"></main>
  <div class="playline" id="progressLine" hidden aria-hidden="true"></div>
  <footer class="bottom">
    <button type="button" class="btn" id="prev">Back</button>
    <span class="now" id="now" aria-live="polite"></span>
    <button type="button" class="btn primary" id="next">Got it</button>
  </footer>
</div>

<script>
// Synthesis engine: same model as lab.html and sonify.py. It runs on the main thread so that
// a sound can be computed and started inside the click that asks for it.
window.SonEngine = (function () {
const SINN = 8192, SIN = new Float32Array(SINN + 1);
for (let i = 0; i <= SINN; i++) SIN[i] = Math.sin(2 * Math.PI * i / SINN);
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function boxPass(src, dst, r) {
  const n = src.length, w = 2 * r + 1; let acc = 0;
  for (let j = -r; j <= r; j++) acc += src[Math.min(n - 1, Math.max(0, j))];
  for (let i = 0; i < n; i++) { dst[i] = acc / w; acc += src[Math.min(n - 1, i + r + 1)] - src[Math.max(0, i - r)]; }
}
function smooth(a, sigma) {
  if (sigma < 1) return a;
  const r = Math.floor(Math.round(Math.sqrt(4 * sigma * sigma + 1)) / 2);
  let A = a, B = new Float32Array(a.length);
  for (let k = 0; k < 3; k++) { boxPass(A, B, r); const t = A; A = B; B = t; }
  return A;
}
function sCurve(spec, n, sr) {
  let s = new Float32Array(n);
  if (spec.type === "const") s.fill(spec.v);
  else if (spec.type === "ramp") { for (let i = 0; i < n; i++) s[i] = spec.from + (spec.to - spec.from) * i / Math.max(1, n - 1); }
  else {
    const v = spec.values, NY = v.length, spy = spec.spy;
    for (let i = 0; i < n; i++) {
      const ty = i / sr / spy - 0.5, k = Math.floor(ty);
      s[i] = ty <= 0 ? v[0] : k >= NY - 1 ? v[NY - 1] : v[k] + (v[k + 1] - v[k]) * (ty - k);
    }
    s = smooth(s, 0.25 * spy * sr);
    for (let i = 0; i < n; i++) s[i] = Math.pow(Math.max(0, s[i]), spec.gamma);
  }
  return s;
}
function render(job) {
  const sr = job.sr, n = Math.max(1, Math.round(job.dur * sr));
  const L = new Float32Array(n), R = new Float32Array(n);
  const rng = mulberry32(job.seed || 7);
  const gauss = () => { let u = 0; while (u === 0) u = rng(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * rng()); };
  const fx = job.fx, NP = job.partials, nyq = 0.45 * sr, TWO_PI = 2 * Math.PI, BS = 32, nb = Math.ceil(n / BS);
  // ghost voice wavetable: the clean note, built with the same partial phases as the note it follows,
  // so that at s = 0 note and ghost have exactly the same waveform
  const TB = 4096;
  const ghostTable = phases => {
    const table = new Float32Array(TB);
    for (let k = 1; k <= NP; k++) { const a = Math.pow(k, -2.2), ph = TWO_PI * phases[k]; for (let i = 0; i < TB; i++) table[i] += a * Math.sin(TWO_PI * k * i / TB + ph); }
    let tm = 0; for (let i = 0; i < TB; i++) tm = Math.max(tm, Math.abs(table[i])); for (let i = 0; i < TB; i++) table[i] /= tm || 1;
    return table;
  };
  for (const vc of job.voices) {
    const s = sCurve(vc.s, n, sr);
    // phases depend only on the voice's position, so every render of the same voice uses the same ones
    const prng = mulberry32(1000 + job.voices.indexOf(vc));
    const phases = new Float64Array(NP + 1); for (let k = 1; k <= NP; k++) phases[k] = prng();
    const table = ghostTable(phases);
    const gl = Math.sqrt((1 - vc.pan) / 2), gr = Math.sqrt((1 + vc.pan) / 2);
    let x = null;
    if (vc.note !== false) {
      const sC = new Float32Array(nb + 1), fC = new Float32Array(nb + 1);
      for (let b = 0; b <= nb; b++) sC[b] = s[Math.min(n - 1, b * BS)];
      let jn = null;
      if (fx.jitter > 0) {
        jn = new Float32Array(nb + 1); for (let b = 0; b <= nb; b++) jn[b] = gauss();
        jn = smooth(jn, 0.03 * sr / BS);
        let m = 0; for (let b = 0; b <= nb; b++) m = Math.max(m, Math.abs(jn[b]));
        for (let b = 0; b <= nb; b++) jn[b] /= m || 1;
      }
      for (let b = 0; b <= nb; b++) {
        let c = vc.dir * fx.detune * sC[b]; if (jn) c += fx.jitter * jn[b] * sC[b];
        fC[b] = vc.f0 * Math.pow(2, c / 1200);
      }
      const B = fx.inharm / 1000, T = fx.bright;
      x = new Float32Array(n);
      for (let k = 1; k <= NP; k++) {
        let ph = phases[k]; const k2 = k * k, lk = Math.log(k), base = Math.pow(k, -2.2);
        const gate = b => job.buildup ? Math.max(0, Math.min(1, (b * BS / sr - (k - 1) * job.buildup) / 0.06)) : 1;
        const fkAt = b => B > 0 ? k * fC[b] * Math.sqrt(1 + B * sC[b] * k2) : k * fC[b];
        const ampAt = (b, fk) => fk >= nyq ? 0 : (T > 0 ? base * Math.exp(T * sC[b] * lk) : base) * gate(b);
        let fa = fkAt(0), aa = ampAt(0, fa);
        for (let b = 0; b < nb; b++) {
          const fb = fkAt(b + 1), ab = ampAt(b + 1, fb);
          const i0 = b * BS, i1 = Math.min(n, i0 + BS), len = i1 - i0;
          if (aa === 0 && ab === 0) { ph += (fa + fb) / 2 / sr * len; ph -= Math.floor(ph); fa = fb; aa = ab; continue; }
          let inc = fa / sr, amp = aa; const dinc = (fb - fa) / sr / len, damp = (ab - aa) / len;
          for (let i = i0; i < i1; i++) {
            const p = ph * SINN, j = p | 0;

      s: { type: "curve", values: sLinear(n, COMMON), spy: o.spy, gamma: o.gamma } })) };
}
function jitterNoise(ms, seed = 3) {
  let a = seed; const rnd = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  let x = Array.from({ length: ms }, () => { let u = 0; while (!u) u = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * rnd()); });
  const r = Math.floor(Math.round(Math.sqrt(4 * 30 * 30 + 1)) / 2);
  for (let p = 0; p < 3; p++) x = x.map((_, i) => { let s = 0; for (let j = -r; j <= r; j++) s += x[Math.min(ms - 1, Math.max(0, i + j))]; return s / (2 * r + 1); });
  const m = Math.max(...x.map(Math.abs)) || 1;
  return x.map(v => v / m);
}
function sContinuous(vals, gamma, P = 50) {
  const n = vals.length * P; let s = new Array(n);
  for (let i = 0; i < n; i++) { const ty = i / P - 0.5, k = Math.floor(ty); s[i] = ty <= 0 ? vals[0] : k >= vals.length - 1 ? vals[vals.length - 1] : vals[k] + (vals[k + 1] - vals[k]) * (ty - k); }
  const sig = 0.25 * P, r = Math.floor(Math.round(Math.sqrt(4 * sig * sig + 1)) / 2);
  for (let p = 0; p < 3; p++) s = s.map((_, i) => { let a = 0; for (let j = -r; j <= r; j++) a += s[Math.min(n - 1, Math.max(0, i + j))]; return a / (2 * r + 1); });
  return s.map(v => Math.pow(Math.max(0, v), gamma));
}

addSlide({

  title: "From submissions to strangeness",
  lead: "Each year is compared with its series' own past. Below the threshold s is 0; at saturation it is 1.",
  formula: ["baseline = median of the baseline period", "r = submissions / baseline", "s = clip((r − threshold) / saturation) ^ γ"],
  hear: "The preview plays the chosen series with every effect on: this is where we are heading.",
  more: () => `<p><b>Baseline</b>: the median of the series over the <b>baseline period</b>, the years treated as the normal past. By default it covers the first ten years (${span(baseDefault())}${isDefaultData() ? "; ICSE 406.5 · FSE 210 · ASE 253" : ""}). Ending the period later folds part of the recent growth into the reference, so less of it sounds strange; ending it earlier makes the growth stand out more. The median is not pulled by isolated spikes.</p>
    <p><b>Threshold</b>: below it, variation counts as normal and s = 0. <b>Saturation</b>: the distance above the threshold at which s = 1.</p>
    <p><b>Saturation scale</b>. <i>Shared</i>: one saturation for every series, so s = 1 always means the same multiple of the baseline (threshold + saturation). The series can be compared directly, and one that grows less reaches a lower s. <i>Per conference</i>: each series gets its own saturation, chosen so that s = 1 in its peak year (saturation = peak / baseline − threshold). Every series then spans the full range from 0 to 1, which makes each one as expressive as possible on its own, but equal values of s no longer mean equal growth. The chord always uses the shared scale; the per-conference scale is for listening to one series at a time.</p>
    <p><b>γ</b>: with γ &gt; 1 small values shrink more than large ones (0.3<sup>1.3</sup> = 0.21; 0.8<sup>1.3</sup> = 0.75), so the past stays quiet.</p>
    <p>To get a continuous signal, s is interpolated between year centres and smoothed (see "Time").</p>`,

    const ch = plot(t, 260, (ctx, w, h) => {

      const bw = (a.X(1) - a.X(0)) * 0.62, col = colorOf(o.name);

      ctx.fillStyle = css("--muted"); ctx.font = `11px ${css("--font-mono")}`; ctx.textAlign = "left"; ctx.textBaseline = "top";
      ctx.fillText(`baseline ${span(o.baseEnd)}`, a.m.l + 4, a.m.t + 2);
      r.forEach((v, i) => { ctx.globalAlpha = sl[i] > 0 ? 1 : 0.28; ctx.fillStyle = col; ctx.beginPath(); ctx.roundRect(a.X(i) - bw / 2, a.Y(v), bw, a.Y(0) - a.Y(v), [3, 3, 0, 0]); ctx.fill(); });
      ctx.globalAlpha = 1;
      const hl = (v, label) => { line(ctx, [[a.m.l, a.Y(v)], [w - a.m.r, a.Y(v)]], css("--ink"), 1, [4, 4]); ctx.fillStyle = css("--ink"); ctx.textAlign = "left"; ctx.textBaseline = "bottom"; ctx.font = `11px ${css("--font-mono")}`; ctx.fillText(label, a.m.l + 4, a.Y(v) - 3); };
      hl(o.threshold, "threshold · s = 0"); hl(satTop, "s = 1");
      // strangeness strip: one square per year, opacity = s
      const yS = h - 16;
      sl.forEach((v, i) => { const s = Math.pow(v, o.gamma); ctx.fillStyle = css("--accent"); ctx.globalAlpha = 0.08 + 0.92 * s; ctx.beginPath(); ctx.roundRect(a.X(i) - bw / 2, yS, bw, 10, 2); ctx.fill(); });
      ctx.globalAlpha = 1; ctx.fillStyle = css("--muted"); ctx.textAlign = "right"; ctx.textBaseline = "middle"; ctx.fillText("s", a.m.l - 8, yS + 5);

    const st = stats(t);
    const k = el("div", { class: "knobs" }); t.append(k);
    knob(k, { label: "Baseline period", min: YEARS[0], max: lastYear() - 1, step: 1, years: true, value: o.baseEnd, fmt: v => span(v), onInput: v => { o.baseEnd = v; redraw(); } });
    knob(k, { label: "Threshold", min: 1, max: 2, step: 0.05, value: o.threshold, fmt: v => fmtN(v) + "×", onInput: v => { o.threshold = v; redraw(); } });
    const sat = knob(k, { label: "Saturation", min: 0.3, max: 3, step: 0.05, value: o.saturate, fmt: v => "+" + fmtN(v), onInput: v => { o.saturate = v; redraw(); } });
    knob(k, { label: "Exponent γ", min: 0.5, max: 3, step: 0.05, value: o.gamma, fmt: v => fmtN(v), onInput: v => { o.gamma = v; redraw(); } });

    const note = el("p", { class: "scale-note", "aria-live": "polite" }); t.append(note);
    const scaleText = () => {

    function redraw() {

    listen(t, { label: `Preview: ${NY} years`, run: b => playJobs(b, [{ dur: NY, partials: DEF.partials, fx: DEF.fx, beat: { vol: DEF.beat, accent: true, spy: 1, startYear: YEARS[0] },
      voices: [voice({ ghost: DEF.ghost, s: { type: "curve", values: sLinear(o.name, o), spy: 1, gamma: o.gamma } })] }], `${o.name} · ${NY} years`, p => { ph = p ? p.t / NY : null; ch.redraw(); }) });

// what the depth means at the current s, for each effect (shown under the knobs)
const hz = (f0, c) => fmtN(f0 * (Math.pow(2, c / 1200) - 1), 1);
const DEPTH_NOTES = {
  detune: (st, s) => `<b>Depth D = ${st.depth} cents</b> is the shift reached at s = 1. At s = ${fmtN(s)} the whole note sits ${fmtN(st.depth * s, 0)} cents above f₀: ${fmtN(st.f0 * Math.pow(2, st.depth * s / 1200), 1)} Hz instead of ${fmtN(st.f0, 0)} Hz.`,
  jitter: (st, s) => `<b>Depth J = ±${st.depth} cents</b> is the widest wobble, reached at s = 1. At s = ${fmtN(s)} the pitch wanders at random within ±${fmtN(st.depth * s, 0)} cents of f₀, that is ±${hz(st.f0, st.depth * s)} Hz around ${fmtN(st.f0, 0)} Hz. It is measured from the note's own pitch, so with detune on it wanders around the shifted note.`,
  inharm: (st, s) => `<b>Depth B = ${fmtN(st.depth, 1)}‰</b> is the stiffness coefficient at s = 1. At s = ${fmtN(s)} the effective value is B · s = ${fmtN(st.depth * s, 2)}‰, which lifts the 10th partial by ${fmtN((Math.sqrt(1 + st.depth / 1000 * s * 100) - 1) * 100, 1)}% above its harmonic position.`,
  bright: (st, s) => `<b>Depth T = ${fmtN(st.depth)}</b> is how much the spectral exponent drops at s = 1. At s = ${fmtN(s)}, α = 2.2 − T · s = ${fmtN(2.2 - st.depth * s)}, a slope of ${fmtN(-6.02 * (2.2 - st.depth * s), 1)} dB per octave instead of −13.2.`,
  fold: (st, s) => `<b>Depth G = ${fmtN(st.depth, 1)}</b> sets the gain at s = 1: ×${fmtN(1 + st.depth, 1)}. At s = ${fmtN(s)} the waveform is amplified ×${fmtN(1 + st.depth * s, 1)} before folding; every 2 above ×1 adds one more fold.`
};
const S_NOTE = s => `<b>Strangeness s = ${fmtN(s)}</b> stands in for one year's value. It sets how strongly the effect acts right now, and it is what With effect and A/B play; the ramp sweeps it from 0 to 1. In the full piece s comes from the data. `;

// ---------- effect slide: one note, one effect ----------
function effectSlide(def) {

    build(t) {
      const st = { s: 0.6, depth: def.depth.value, f0: DEF.f0, ghost: def.ghost ?? DEF.ghost, live: null };
      const sv = () => st.live ?? st.s;
      const draw = plot(t, def.height || 240, (ctx, w, h) => def.draw(ctx, w, h, st, sv()));
      const statsSet = stats(t);
      const k = el("div", { class: "knobs" }); t.append(k);
      const sK = knob(k, { label: "Strangeness s", main: true, min: 0, max: 1, step: 0.01, value: st.s, fmt: v => fmtN(v), onInput: v => { st.s = v; st.live = null; redraw(); } });
      knob(k, Object.assign({}, def.depth, { onInput: v => { st.depth = v; redraw(); } }));
      // explanation of s and depth, closed by default like More settings; its text follows the knobs
      const kn = el("p", { class: "knob-note", "aria-live": "polite" });
      t.append(el("details", { class: "opts" }, [el("summary", { text: "What s and depth mean here" }), kn]));
      const fx = () => Object.assign({}, NOFX, { [def.key]: st.depth });
      const job = (s, d = 2.5) => ({ dur: d, partials: DEF.partials, fx: fx(), voices: [voice({ f0: st.f0, ghost: st.ghost, s })] });
      options(t, b => {
        knob(b, { label: "Ghost voice", min: 0, max: 1, step: 0.05, value: st.ghost, fmt: v => v ? Math.round(v * 100) + "%" : "off", onInput: v => { st.ghost = v; redraw(); } });
        b.append(el("p", { class: "opt-note", html: "<b>Ghost voice</b>: a second copy of the same note that plays alongside it with <b>no effects</b> and a fixed pitch. It is the reference that makes a change audible: a note that has moved, or whose partials have shifted, is heard against the ghost, which stays where the note started. With detune and jitter the two beat against each other. The slider sets its volume relative to the note (35% by default); turn it off to hear the transformed note alone and notice how much harder the change is to hear. In the full piece every series has its own ghost voice; the Chord step comes back to it." }));
        chips(b, { title: "Fundamental f₀", label: "Fundamental", options: NOTES, value: st.f0, onChange: v => { st.f0 = v; redraw(); } });
        b.append(el("p", { class: "opt-note", html: "<b>Fundamental f₀</b>: the pitch of the note used in this experiment. Effects measured in cents sound the same at any pitch; those measured in hertz, such as beats, scale with it." }));
      }, "More settings: ghost voice and pitch");
      function redraw() { draw.redraw(); statsSet(def.stats(st, sv())); kn.innerHTML = S_NOTE(sv()) + DEPTH_NOTES[def.key](st, sv()); }
      redraw();
      listen(t, { label: "Ramp: s from 0 to 1", run: b => playJobs(b, [job({ type: "ramp", from: 0, to: 1 }, 6)], `${def.label} · ramp`, p => { st.live = p ? p.frac : null; sK.set(sv()); redraw(); }) }, [
        { label: "Clean", run: b => playJobs(b, [job(C(0))], "clean note") },
        { label: "With effect", run: b => playJobs(b, [job(C(st.s))], `${def.label} · s = ${fmtN(st.s)}`) },
        { label: "A/B", run: b => playJobs(b, [job(C(0)), job(C(st.s))], `A clean · B ${def.label}`) }
      ]);
    }
  });
}

effectSlide({
  id: "detune", key: "detune", label: "Detune", eyebrow: "Step 3 · Pitch",
  terms: ["cent", "beating", "roughness", "ghost-voice"],
  title: "Detune: the note shifts",
  lead: "The whole note moves up or down by a few cents. Next to the ghost voice, which stays put, beats appear.",
  formula: ["Δc = dir · D · s", "f = f₀ · 2^(Δc / 1200)", "beat = k · |f − f₀|"],
  hear: "A pulsing in loudness that speeds up with s, until it turns into roughness.",
  more: `<p>100 cents make a semitone, 1200 an octave: the scale is logarithmic, like pitch perception. D is the depth (90 cents by default). dir = −1 for ICSE and +1 for FSE and ASE, so in the chord the notes move apart instead of transposing together.</p>
    <p>On its own, a shifted note just sounds like another note: it needs a reference. Two nearby sine waves added together swing in amplitude at |f − f₀| (the beat). Partial k beats at k · |f − f₀|, so high partials beat faster. Above about 15–20 Hz the beating becomes <b>roughness</b>; beyond about a semitone the two notes separate into a dissonant interval.</p>`,
  depth: { label: "Depth D", min: 0, max: 200, step: 5, value: DEF.fx.detune, fmt: v => v + " cents" },
  draw(ctx, w, h, st, s) {
    const f = st.f0 * Math.pow(2, s * st.depth / 1200), df = Math.abs(f - st.f0), g = st.ghost;
    const a = axes(ctx, w, h, { x0: 0, x1: 2, y0: 0, y1: 1.45, yTicks: [0, 1], yFmt: () => "", xTicks: [0, 1, 2], xFmt: v => v + " s", m: { l: 8 } });
    const env = (k, color, width) => { const pts = []; for (let i = 0; i <= 600; i++) { const tt = i / 300; pts.push([a.X(tt), a.Y(Math.sqrt(1 + g * g + 2 * g * Math.cos(2 * Math.PI * k * df * tt)))]); } line(ctx, pts, color, width); };
    env(10, css("--ghost"), 1.2); env(1, css("--accent"), 2.5);
    ctx.font = `11px ${css("--font-mono")}`; ctx.textAlign = "left"; ctx.textBaseline = "top"; ctx.fillStyle = css("--accent"); ctx.fillText("1st partial", a.m.l + 4, a.m.t); ctx.fillStyle = css("--muted"); ctx.fillText("10th partial", a.m.l + 96, a.m.t);
  },
  stats(st, s) { const c = s * st.depth, f = st.f0 * Math.pow(2, c / 1200), df = Math.abs(f - st.f0); return [[sign(Math.round(c)) + " cents", "shift Δc"], [fmtN(df, 1) + " Hz", "beat, 1st partial"], [fmtN(10 * df, 0) + " Hz", "beat, 10th"]]; }
});

const NOISE = jitterNoise(3000);
effectSlide({
  id: "jitter", key: "jitter", label: "Jitter", eyebrow: "Step 4 · Pitch",
  terms: ["cent", "vibrato", "beating"],
  title: "Jitter: the pitch won't sit still",
  lead: "A continuous random deviation of pitch, added on top of detune.",
  formula: ["Δc = dir · D · s + J · s · n(t)"],
  hear: "The note floats without rhythm, and the beats keep changing speed.",
  more: `<p>n(t) is Gaussian noise, low-pass filtered (three moving averages, standard deviation about 30 ms) and normalised to −1…+1: the pitch glides without jumps. J is the depth (±20 cents by default).</p>
    <p>Unlike <b>vibrato</b>, which is periodic and regular (5–7 Hz) and heard as expressive, jitter has no period and is heard as instability. In frequency it is small (±20 cents at 220 Hz ≈ ±2.5 Hz): it hardly shows in the spectrogram, but you can hear it. Detune is off on this slide, so jitter wanders around f₀.</p>
    <p><b>A worked example.</b> J sets the widest swing, reached only at s = 1; below that, the swing shrinks in proportion to s. With the defaults (f₀ = 220 Hz, J = ±20 cents):</p>
    <ul>
      <li>at s = 0.60 the pitch can move at most ±12 cents (20 × 0.60), so it stays between about 218.5 and 221.5 Hz;</li>
      <li>at s = 1 it can move ±20 cents, between about 217.5 and 222.6 Hz.</li>
    </ul>
    <p>These are the limits, not the usual values. The noise reaches its extremes only now and then, so most of the time the pitch is closer to the centre.</p>
    <p><b>In musical terms</b>, for readers who work with intervals: 100 cents make a semitone, so ±12 cents is about an eighth of a semitone either way. On its own that is a small deviation, but against a steady reference such as the ghost voice it is clearly audible as unsteady beating.</p>`,
  depth: { label: "Depth J", min: 0, max: 60, step: 1, value: DEF.fx.jitter, fmt: v => "±" + v + " cents" },
  draw(ctx, w, h, st, s) {
    const amp = st.depth * s;
    const a = axes(ctx, w, h, { x0: 0, x1: 3, y0: -65, y1: 65, yTicks: [-60, 0, 60], yFmt: v => (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v), xTicks: [0, 1, 2, 3], xFmt: v => v + " s", m: { l: 36 } });
    line(ctx, [[a.X(0), a.Y(0)], [a.X(3), a.Y(0)]], css("--ghost"), 3);
    line(ctx, NOISE.map((v, i) => [a.X(i / 1000), a.Y(amp * v)]), css("--accent"), 2.2);
  },
  stats(st, s) { const c = st.depth * s; return [["±" + fmtN(c, 0) + " cents", "maximum deviation"], ["±" + fmtN(st.f0 * (Math.pow(2, c / 1200) - 1), 1) + " Hz", "at the fundamental"]]; }
});

effectSlide({
  id: "inharmonicity", key: "inharm", label: "Inharmonicity", eyebrow: "Step 5 · Partial positions",
  terms: ["inharmonicity", "stiff-string", "harmonic-series", "cent"],
  title: "Inharmonicity: partials leave the series",
  lead: "Partials rise above their whole-number multiples, the high ones most. The note loses a clear pitch and turns metallic.",
  formula: ["fₖ = k · f · √(1 + B · s · k²)"],
  hear: "The fundamental stays, but above it appear components that no longer fuse with it.",
  more: `<p>This is the physical model of a <b>stiff string</b>: stiffness raises the frequency of the higher modes, as happens slightly in piano strings. With B = 2.5‰ and s = 1 the 2nd partial rises 0.5%, the 10th 11.8% (about 2 semitones), the 20th 41%. The shift grows with k².</p>
    <p>The auditory system groups partials in whole-number ratios into one note. When the ratios stop being whole numbers, the grouping weakens: ambiguous pitch, metallic timbre, as in bells and gongs. In the tool's spectrogram the ridges bend upwards and fan out.</p>
    <p><b>A worked example.</b> The percentages on the right are frequency shifts: how far each partial sits above its harmonic position k · f₀. With the defaults (f₀ = 220 Hz, B = 2.5‰, s = 0.60):</p>
    <ul>
      <li>the 2nd partial should be at 440 Hz; with +0.3% it is at about 441 Hz;</li>
      <li>the 10th partial should be at 2200 Hz; with +7.2% it is at about 2359 Hz;</li>
      <li>the 20th partial should be at 4400 Hz; with +26.5% it is at about 5566 Hz.</li>
    </ul>
    <p>At s = 1 the same partials move to about 442 Hz (+0.5%), 2460 Hz (+11.8%) and 6223 Hz (+41.4%). The fundamental itself does not move, which is why the note keeps a recognisable base while its upper partials drift away.</p>
    <p><b>In musical terms</b>, for readers who work with intervals: a frequency ratio converts to cents with cents = 1200 · log₂(ratio), and 100 cents make a semitone. At s = 0.60 the 2nd partial moves about 5 cents (barely audible), the 10th about 121 cents (just over a semitone) and the 20th about 407 cents (a little more than a major third). At s = 1 the 10th moves about 193 cents (almost a whole tone) and the 20th about 600 cents (a tritone). High partials a third or a tritone away from where they belong are what stop the ear from hearing a single, clear pitch.</p>`,
  depth: { label: "Coefficient B", min: 0, max: 6, step: 0.1, value: DEF.fx.inharm, fmt: v => fmtN(v, 1) + "‰" },
  draw(ctx, w, h, st, s) {
    const ghost = partialsOf({ f0: st.f0, N: DEF.partials });
    drawSpectrum(ctx, w, h, { fmax: 5000, grid: ghost.map(p => p.f), ghost, parts: partialsOf({ f0: st.f0, N: DEF.partials, s, fx: { inharm: st.depth } }) });
  },
  stats(st, s) { const d = k => (Math.sqrt(1 + st.depth / 1000 * s * k * k) - 1) * 100; return [["+" + fmtN(d(2), 1) + "%", "2nd partial"], ["+" + fmtN(d(10), 1) + "%", "10th partial"], ["+" + fmtN(d(20), 0) + "%", "20th partial"]]; }
});

effectSlide({
  id: "tilt", key: "bright", label: "Spectral tilt", eyebrow: "Step 6 · Partial amplitudes",
  terms: ["spectral-tilt", "spectral-centroid", "decibel"],
  title: "Spectral tilt: more energy up high",
  lead: "Only the partial amplitudes change: the spectral slope flattens and the sound gets brighter.",
  formula: ["Aₖ = k^−α,   α = 2.2 − T · s", "slope = −6.02 · α dB/octave"],
  hear: "Same pitch, same stability: more light and more bite.",
  more: `<p>At s = 0, α = 2.2: −13.2 dB/octave, a steep spectrum and a dark timbre. With T = 1.2 and s = 1, α = 1: −6 dB/octave, the spectrum of a sawtooth. The 10th partial goes from −44 to −20 dB. After summing, the wave is normalised to its peak, so the fundamental loses weight in proportion.</p>
    <p>The balance of energy between low and high partials is the main correlate of perceived <b>brightness</b>, measured by the spectral centroid. This effect also makes inharmonicity and beating more audible, since both are strongest in the high partials.</p>`,
  depth: { label: "Depth T", min: 0, max: 2, step: 0.05, value: DEF.fx.bright, fmt: v => fmtN(v) },
  draw(ctx, w, h, st, s) {

    const a = drawSpectrum(ctx, w, h, { fmax, ghost: partialsOf({ f0: st.f0, N: DEF.partials }), parts: partialsOf({ f0: st.f0, N: DEF.partials, s, fx: { bright: st.depth } }) });
    const slope = (al, color) => { const pts = []; for (let f = st.f0; f <= fmax; f += 25) pts.push([a.X(f), a.Y(Math.max(-70, -6.02 * al * Math.log2(f / st.f0)))]); line(ctx, pts, color, 1.5, [5, 5]); };
    slope(2.2, css("--ghost")); slope(alpha, css("--accent"));
  },
  stats(st, s) {
    const al = 2.2 - st.depth * s, cen = al2 => { const ps = partialsOf({ f0: st.f0, N: DEF.partials, s: 1, fx: { bright: 2.2 - al2 } }); return ps.reduce((x, p) => x + p.f * p.a, 0) / ps.reduce((x, p) => x + p.a, 0); };
    return [[fmtN(-6.02 * al, 1) + " dB", "per octave (from −13.2)"], [Math.round(cen(al)) + " Hz", `centroid (from ${Math.round(cen(2.2))})`]];
  }
});

effectSlide({
  id: "wavefolding", key: "fold", label: "Wavefolding", eyebrow: "Step 7 · Waveform",
  terms: ["transfer-function", "nonlinearity", "intermodulation", "aliasing", "sample-rate"],
  title: "Wavefolding: the wave folds back",
  lead: "The waveform is amplified and, past the limit, folded back on itself. New partials appear.",
  formula: ["g = 1 + G · s", "y = (1 − s) · x + s · sin(π/2 · g · x)"],
  hear: "The grain goes from smooth to buzzing, then rough, in steps.",
  more: `<p>It acts on the waveform that is already summed and normalised (x between −1 and +1). sin(π/2 · g · x) is the ${term("transfer-function", "transfer function")}: at g = 1 it is close to a straight line; at higher g, values past the limit are <b>reflected</b> rather than clipped, several times over. Every fold puts a corner in the wave.</p>
    <p>A ${term("nonlinearity", "nonlinearity")} creates new frequencies, of two kinds:</p>
    <ul>
      <li><b>harmonics</b>: multiples of the partials already present;</li>
      <li>${term("intermodulation", "intermodulation")}: sums and differences between pairs of partials. For example, partials at 660 and 880 Hz also produce 220 Hz (their difference) and 1540 Hz (their sum).</li>
    </ul>
    <p>On a harmonic note these products are again multiples of the fundamental, so the note stays in tune and becomes richer and rougher. On a note that is already inharmonic they land in irregular places, and the result is dissonant.</p>
    <p>At high gain some new components rise above 22,050 Hz, the highest frequency the audio can hold. They do not vanish: they reflect back down to lower, unrelated frequencies. This is ${term("aliasing", "aliasing")}, and it adds a grainy haze. For example, a component created at 25,000 Hz is heard at 19,100 Hz.</p>
    <p>Wavefolding is applied to each note before the ghost voice is added, so the ghost stays clean. The underlined terms open a fuller explanation with more examples.</p>`,
  depth: { label: "Depth G", min: 0, max: 10, step: 0.5, value: DEF.fx.fold, fmt: v => "×" + fmtN(1 + v, 1) },
  draw(ctx, w, h, st, s) { drawWave(ctx, w, h, { f0: st.f0, before: cycleOf({ f0: st.f0, N: DEF.partials }, 600, false), cyc: cycleOf({ f0: st.f0, N: DEF.partials, s, fx: { fold: st.depth } }) }); },
  stats(st, s) {
    const g = 1 + st.depth * s, folds = g > 1 ? Math.ceil((g - 1) / 2 - 1e-9) : 0;
    const hs = harmonicsOf(cycleOf({ f0: st.f0, N: DEF.partials, s, fx: { fold: st.depth } })), tot = hs.reduce((a, v) => a + v * v, 0), hi = hs.slice(DEF.partials).reduce((a, v) => a + v * v, 0);
    return [["×" + fmtN(g, 1), "gain g"], [String(folds), "folds"], [fmtN(100 * hi / (tot || 1), 1) + "%", "energy in new partials"]];
  }
});

  jitter: "unsteady pitch and irregular beats, with no rhythm.",
  inharm: "the fundamental stays, but components above it no longer fuse: a metallic timbre.",

  fold: "the grain changes: from smooth to buzzing and rough, in steps."

// ---------------- quiz ----------------
// Four modes. The listening is the same in free practice, the round and the adaptive mode:
// a 6-second ramp of s on A3, ghost voice on, each effect at its default depth.
const KEYS = Object.keys(FX_NAMES);
const ROUND_EACH = 2, LEVEL_Q = 4, LEVEL_PASS = 3;
const LEVELS = [
  { name: "Level 1 · with a reference", note: "one effect at full depth, ghost voice on", ghost: true, scale: 1 },
  { name: "Level 2 · no reference", note: "one effect at full depth, no ghost voice to compare against", ghost: false, scale: 1 },
  { name: "Level 3 · subtle", note: "one effect at half depth, ghost voice on", ghost: true, scale: 0.5 },
  { name: "Level 4 · two at once", note: "two effects together: pick both, then press Check", ghost: true, scale: 1, pair: true },
  { name: "Level 5 · in the piece", note: "the last years of the full piece twice, first complete (A), then with one effect missing (B)", real: true }
];
const QUIZ_MODES = {
  free: "Random questions with no end. Each one plays a 6-second ramp of s on one note, ghost voice on, with a single effect at its default depth.",
  round: `A fixed round of ${KEYS.length * ROUND_EACH} questions: each effect appears exactly ${ROUND_EACH} times, in random order, with the same listening as free practice. At the end you see your score for each effect.`,
  levels: `Five levels of increasing difficulty, ${LEVEL_Q} questions each. Get at least ${LEVEL_PASS} right to move up; otherwise the level starts again.`,
  adaptive: "Random questions with the same listening as free practice, but every mistake puts that effect back in the queue: it returns more often until you recognise it twice in a row. The quiz ends when every effect is learned."
};
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
function rampJob(keys, { ghost = true, scale = 1 } = {}) {
  const fx = Object.assign({}, NOFX); keys.forEach(k => { fx[k] = DEF.fx[k] * scale; });
  return { dur: 6, partials: DEF.partials, fx, voices: [voice({ ghost: ghost ? DEF.ghost : 0, s: { type: "ramp", from: 0, to: 1 } })] };
}
// the last `years` years of the full chord, with the given effects
function excerptJob(fx, years = 6) {
  const from = Math.max(0, NY - years);
  return { dur: (NY - from) * DEF.spy, partials: DEF.partials, fx, beat: { vol: DEF.beat, accent: DEF.accent, spy: DEF.spy, startYear: YEARS[from] },
    voices: NAMES.map(n => voice({ f0: chordOf(n).f0, dir: chordOf(n).dir, pan: chordOf(n).pan, ghost: DEF.ghost,
      s: { type: "curve", values: sLinear(n, COMMON).slice(from), spy: DEF.spy, gamma: DEF.gamma } })) };
}
function buildQuiz(t) {
  const Q = { mode: "free" };
  const learned = k => Q.streak[k] >= 2 && Q.debt[k] === 0;
  function reset() {
    Object.assign(Q, { q: null, answered: true, sel: new Set(), right: 0, total: 0, msg: "",
      deck: shuffle(KEYS.flatMap(k => Array(ROUND_EACH).fill(k))), i: 0, per: Object.fromEntries(KEYS.map(k => [k, { right: 0, total: 0 }])),
      level: 0, lq: 0, lright: 0,
      debt: Object.fromEntries(KEYS.map(k => [k, 0])), streak: Object.fromEntries(KEYS.map(k => [k, 0])), finished: false });
  }
  reset();
  chips(t, { label: "Quiz mode", options: [["free", "Free practice"], ["round", "Round of 10"], ["levels", "Levels"], ["adaptive", "Adaptive"]], value: Q.mode,
    onChange: v => { stopAudio(); Q.mode = v; reset(); fb.textContent = "Press Start to hear the first question."; prepAnswers(); render(); } });
  const modeNote = el("p", { class: "scale-note" }); t.append(modeNote);
  const fb = el("p", { class: "feedback", "aria-live": "polite", text: "Press Start to hear the first question." });
  const ans = el("div", { class: "chips" });
  const btns = Object.fromEntries(KEYS.map(k => { const b = el("button", { type: "button", class: "chip", text: FX_NAMES[k], disabled: "" }); b.addEventListener("click", () => choose(k)); ans.append(b); return [k, b]; }));
  const check = el("button", { type: "button", class: "btn", text: "Check", hidden: "" }); check.addEventListener("click", () => submit([...Q.sel]));
  const status = el("p", { class: "quiz-status", "aria-live": "polite" });
  const main = listen(t, { label: "Start", run: b => {
    if (!Q.q || Q.answered) { nextQuestion(); prepAnswers(); fb.textContent = Q.q.prompt; render(); }
    playJobs(b, Q.q.jobs, Q.q.type === "missing" ? "A complete · B one effect missing" : "quiz");
  } });
  t.append(ans, el("div", { class: "actions" }, [check]), fb, status);

  function adaptivePick() {
    const owed = KEYS.filter(k => Q.debt[k] > 0), open = KEYS.filter(k => !learned(k));
    if (owed.length && Math.random() < 0.75) {
      let r = Math.random() * owed.reduce((a, k) => a + Q.debt[k], 0);
      for (const k of owed) { r -= Q.debt[k]; if (r <= 0) return k; }
    }
    const pool = open.length ? open : KEYS; let k;
    do { k = pick(pool); } while (pool.length > 1 && Q.q && k === Q.q.keys[0] && Math.random() < 0.7);
    return k;
  }
  function nextQuestion() {
    if ((Q.mode === "round" && Q.i >= Q.deck.length) || (Q.mode === "levels" && Q.level >= LEVELS.length) || (Q.mode === "adaptive" && Q.finished)) reset();
    const L = Q.mode === "levels" ? LEVELS[Q.level] : null;
    let keys, type = "single";
    if (Q.mode === "free") { let k; do { k = pick(KEYS); } while (Q.q && k === Q.q.keys[0] && Math.random() < 0.7); keys = [k]; }
    else if (Q.mode === "round") keys = [Q.deck[Q.i]];
    else if (Q.mode === "adaptive") keys = [adaptivePick()];
    else if (L.pair) { keys = shuffle(KEYS.slice()).slice(0, 2); type = "pair"; }
    else if (L.real) { keys = [pick(KEYS)]; type = "missing"; }
    else keys = [pick(KEYS)];
    let jobs, prompt;
    if (type === "missing") {
      jobs = [excerptJob(Object.assign({}, DEF.fx)), excerptJob(Object.assign({}, DEF.fx, { [keys[0]]: 0 }))];
      prompt = "You hear A, a pause, then B. Which effect is missing in B?";
    } else {
      jobs = [rampJob(keys, L ? { ghost: L.ghost, scale: L.scale } : {})];
      prompt = type === "pair" ? "Two effects are on. Pick both, then press Check." : "Which effect do you hear?";
    }
    Q.q = { keys, type, jobs, prompt }; Q.answered = false; Q.sel = new Set(); Q.msg = "";
  }
  function prepAnswers() {
    const live = Q.q && !Q.answered, pair = live && Q.q.type === "pair";
    KEYS.forEach(k => { const b = btns[k]; b.disabled = !live; b.classList.remove("right", "wrong"); if (pair) b.setAttribute("aria-pressed", "false"); else b.removeAttribute("aria-pressed"); });
    check.hidden = !pair; check.disabled = true;
  }
  function choose(k) {
    if (!Q.q || Q.answered) return;
    if (Q.q.type !== "pair") { submit([k]); return; }
    if (Q.sel.has(k)) Q.sel.delete(k); else if (Q.sel.size < 2) Q.sel.add(k);
    KEYS.forEach(x => btns[x].setAttribute("aria-pressed", String(Q.sel.has(x))));
    check.disabled = Q.sel.size !== 2;
  }
  function submit(chosen) {
    if (!Q.q || Q.answered) return;
    Q.answered = true;
    const want = Q.q.keys, ok = chosen.length === want.length && chosen.every(k => want.includes(k));
    KEYS.forEach(k => { const b = btns[k]; b.disabled = true; b.removeAttribute("aria-pressed"); if (want.includes(k)) b.classList.add("right"); else if (chosen.includes(k)) b.classList.add("wrong"); });
    check.hidden = true;
    Q.total++; if (ok) Q.right++;
    const names = want.map(k => FX_NAMES[k]).join(" and ");
    fb.textContent = (ok ? "Correct. " : `It was ${names}. `) + want.map(k => `${FX_NAMES[k]}: ${FX_CUES[k]}`).join(" ");
    record(want, chosen, ok); render();
  }
  function record(want, chosen, ok) {
    if (Q.mode === "round") { Q.per[want[0]].total++; if (ok) Q.per[want[0]].right++; Q.i++; }
    if (Q.mode === "levels") {
      Q.lq++; if (ok) Q.lright++;
      if (Q.lq >= LEVEL_Q) {
        const L = LEVELS[Q.level];
        if (Q.lright >= LEVEL_PASS) { Q.msg = `${L.name} passed, ${Q.lright} of ${LEVEL_Q}.`; Q.level++; }
        else Q.msg = `${Q.lright} of ${LEVEL_Q} is not enough to move up, so ${L.name} starts again.`;
        Q.lq = 0; Q.lright = 0;
      }
    }
    if (Q.mode === "adaptive") {
      const k = want[0];
      if (ok) { Q.debt[k] = Math.max(0, Q.debt[k] - 1); Q.streak[k]++; }
      else { Q.debt[k] += 2; Q.streak[k] = 0; chosen.forEach(c => { if (c !== k) Q.debt[c] += 1; }); }
      Q.finished = KEYS.every(learned);
    }
  }
  function render() {
    modeNote.textContent = QUIZ_MODES[Q.mode];
    const waiting = !Q.q || Q.answered;
    let label = waiting ? (Q.q ? "Next question" : "Start") : "Play the question again", s = "";
    if (Q.mode === "free") s = Q.total ? `<b>${Q.right} of ${Q.total}</b> correct` : "";
    if (Q.mode === "round") {
      const done = Q.i >= Q.deck.length;
      s = done ? `<b>Round complete: ${Q.right} of ${Q.total}.</b> ` + KEYS.map(k => `${FX_NAMES[k]} ${Q.per[k].right}/${Q.per[k].total}`).join(" · ")
               : `Question ${Math.min(Q.deck.length, Q.i + (waiting ? 0 : 1))} of ${Q.deck.length} · ${Q.right} correct`;
      if (done && waiting) label = "Start a new round";
    }
    if (Q.mode === "levels") {
      if (Q.level >= LEVELS.length) { s = `<b>All five levels passed.</b> ${Q.msg}`; if (waiting) label = "Start again"; }
      else { const L = LEVELS[Q.level]; s = `<b>${L.name}</b>: ${L.note}. Question ${Q.lq + (waiting ? 0 : 1)} of ${LEVEL_Q} · ${Q.lright} correct${Q.msg ? ". " + Q.msg : ""}`; }
    }
    if (Q.mode === "adaptive") {
      s = KEYS.map(k => learned(k) ? `${FX_NAMES[k]} ✓` : Q.debt[k] ? `${FX_NAMES[k]}: ${Q.debt[k]} more` : `${FX_NAMES[k]} ${Q.streak[k]}/2`).join(" · ");
      if (Q.finished) { s = `<b>Every effect learned.</b> ` + s; if (waiting) label = "Start again"; }
    }
    status.innerHTML = s;
    main.lastChild.nodeValue = label;
  }
  render();
}

addSlide({
  id: "listening", label: "Listening", eyebrow: "Step 10 · Recognising",
  title: "Recognising the effects",
  lead: "Switch effects off one at a time in the full piece, then test yourself with the quiz.",
  formula: null,
  hear: "Pitch: detune and jitter. Coherence: inharmonicity. Timbre: spectral tilt. Grain: wavefolding.",
  more: `<ul>${Object.keys(FX_NAMES).map(k => `<li><b>${FX_NAMES[k]}</b>: ${FX_CUES[k]}</li>`).join("")}</ul><p>When subtracting, focus on the last few years, where s is highest.</p>`,
  build(t) {
    const on = { detune: true, jitter: true, inharm: true, bright: true, fold: true };
    t.append(el("p", { class: "sub", text: "Subtraction" }));
    const c = el("div", { class: "chips" }); t.append(c);
    Object.keys(FX_NAMES).forEach(k => toggle(c, FX_NAMES[k], true, v => { on[k] = v; }));
    listen(t, { label: "Play with these effects", run: b => {
      const fx = {}; Object.keys(FX_NAMES).forEach(k => fx[k] = on[k] ? DEF.fx[k] : 0);
      const off = Object.keys(FX_NAMES).filter(k => !on[k]).map(k => FX_NAMES[k]);
      playJobs(b, [fullPieceJob({ fx })], off.length ? "without " + off.join(", ") : "full piece", p => { if (p) nowEl.textContent = `▶ ${YEARS[Math.min(NY - 1, Math.floor(p.t))]}` + (off.length ? " · without " + off.join(", ") : ""); });
    } });
    t.append(el("div", { class: "divider" }));
    t.append(el("p", { class: "sub", text: "Quiz" }));
    buildQuiz(t);
  }
});

addSlide({
  id: "tool", label: "Tool", eyebrow: "The end",
  title: "Ready for the tool",
  lead: "The tool uses the same parameters, with the same names and values, and adds a view of the whole piece.",
  formula: null,
  hear: "In the tool, the Solo button on each effect gives the same isolation as these slides.",
  more: `<table class="map"><tbody>${[
    ["Threshold, saturation, scale, γ", "From data to strangeness"], ["Real data or ramp", "Listening · Strangeness source"], ["Chord or single conference", "Listening · What to play"],
    ["Partials, note, ghost voice, breathing", "Voices"], ["Detune, jitter, inharmonicity, spectral tilt, wavefolding", "Synthesis effects"],
    ["Length of a year, beat, accent", "Time and beat"], ["Baseline, smoothing", "fixed"]].map(([a, b]) => `<tr><td>${a}</td><td>${b}</td></tr>`).join("")}</tbody></table>`,
  build(t) {
    t.append(el("ul", { class: "feat" }, [
      el("li", { text: "3D spectrogram of the piece, with Perspective, Top, Profile and Bars views" }),
      el("li", { text: "Time bar to move between years" }),
      el("li", { text: "Settings export to render WAV files with sonify.py" })
    ]));
    if (!isDefaultData()) t.append(el("p", { class: "data-note", text: "The tool uses the built-in data (ICSE, FSE and ASE, 2006–2025), not the data you entered in the first step." }));
    t.append(el("a", { class: "cta", href: "lab.html", text: "Open Submissions in Sound →" }));
  }
});

// ---------------- navigation ----------------
// Only the steps already reached are shown; the rest of the bar is an unlabelled track.
const progEl = document.getElementById("progress"), slideEl = document.getElementById("slide"), nameEl = document.getElementById("stepName");
const prevBtn = document.getElementById("prev"), nextBtn = document.getElementById("next");
let reached = 0, cur = 0;
try { reached = Math.min(SLIDES.length - 1, Math.max(0, parseInt(localStorage.getItem("anatomia-reached") || "0", 10) || 0)); } catch (e) {}
const saveReached = () => { try { localStorage.setItem("anatomia-reached", String(reached)); } catch (e) {} };
const val = x => typeof x === "function" ? x() : x;
function renderProgress() {
  progEl.textContent = "";
  for (let j = 0; j <= reached; j++) {
    const b = el("button", { type: "button", "aria-label": `Step ${j + 1}: ${SLIDES[j].label}`, title: SLIDES[j].label, onclick: () => go(j) });
    if (j === cur) b.setAttribute("aria-current", "step"); else b.classList.add("seen");
    progEl.append(b);
  }
  const rest = SLIDES.length - 1 - reached;
  if (rest > 0) { const r = el("span", { class: "rest", "aria-hidden": "true" }); r.style.flex = String(rest); progEl.append(r); }
}
function go(i) {
  i = Math.max(0, Math.min(reached, i));
  stopAudio(); cur = i;
  const s = SLIDES[i];
  slideEl.textContent = "";
  const idea = el("article", { class: "idea" }, [el("p", { class: "eyebrow", text: s.eyebrow }), el("h2", { text: val(s.title) }), el("p", { class: "lead", text: val(s.lead) })]);
  const formula = val(s.formula), hear = val(s.hear), more = val(s.more);
  if (formula) idea.append(el("div", { class: "formula" }, formula.map(f => el("div", { text: f }))));
  if (hear) idea.append(el("p", { class: "hear" }, [el("span", { text: "What to listen for" }), hear]));
  if (more) { const d = el("details", { class: "more" }, [el("summary", { text: "Technical details" })]); d.append(el("div", { class: "body", html: more })); idea.append(d); }
  if (s.terms && s.terms.length) idea.append(el("div", { class: "terms" }, [el("span", { text: "Concepts" }), ...s.terms.map(id => el("a", { class: "chip", href: glossUrl(id), text: GLOSS[id] || id }))]));
  const tool = el("section", { class: "tool", "aria-label": "Experiment" });
  slideEl.append(idea, tool);
  s.build(tool);
  nameEl.textContent = `Step ${i + 1} · ${s.label}`;
  renderProgress();
  prevBtn.disabled = i === 0;
  nextBtn.textContent = i === SLIDES.length - 1 ? "Done" : "Got it";
  if (location.hash !== "#" + s.id) history.replaceState(null, "", "#" + s.id);
  window.scrollTo({ top: 0 }); slideEl.focus({ preventScroll: true });
}
prevBtn.addEventListener("click", () => go(cur - 1));
nextBtn.addEventListener("click", () => {
  if (cur < SLIDES.length - 1) { reached = Math.max(reached, cur + 1); saveReached(); go(cur + 1); }
});
document.addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest("input, select, textarea, summary")) return;
  if (e.key === "ArrowRight" && cur < reached) go(cur + 1); else if (e.key === "ArrowLeft") go(cur - 1);
});
window.addEventListener("hashchange", () => { const i = SLIDES.findIndex(s => "#" + s.id === location.hash); if (i >= 0 && i !== cur) go(i); });
const start = SLIDES.findIndex(s => "#" + s.id === location.hash);
go(start >= 0 ? start : 0);
})();
</script>
