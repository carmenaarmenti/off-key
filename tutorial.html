<meta charset="utf-8">
<title>Anatomia della Stranezza</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: una slide per schermata. A sinistra l'idea (titolo, frase, formula), a destra lo strumento (un grafico, una manopola s, un pulsante di ascolto). Sopra una barra di avanzamento, sotto due pulsanti. */
:root {
  --bg: #f6f6fa;
  --surface: #ffffff;
  --ink: #15161f;
  --muted: #6b6f83;
  --faint: #a3a6b8;
  --line: #e7e8f0;
  --accent: #5a4ae0;
  --accent-ink: #ffffff;
  --accent-soft: #efedff;
  --ghost: #b9bccb;
  --icse: #d4473a;
  --fse: #13917f;
  --ase: #c47a0c;
  --good: #13917f;
  --font-display: "Space Grotesk", "Inter", system-ui, sans-serif;
  --font-text: "Inter", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d0e14; --surface: #15161f; --ink: #ececf3; --muted: #9094aa; --faint: #5d6178; --line: #252735;
    --accent: #a396ff; --accent-ink: #14122a; --accent-soft: #211e3c; --ghost: #4f5469;
    --icse: #ff6f61; --fse: #3fcab6; --ase: #f2aa3c; --good: #3fcab6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d0e14; --surface: #15161f; --ink: #ececf3; --muted: #9094aa; --faint: #5d6178; --line: #252735;
  --accent: #a396ff; --accent-ink: #14122a; --accent-soft: #211e3c; --ghost: #4f5469;
  --icse: #ff6f61; --fse: #3fcab6; --ase: #f2aa3c; --good: #3fcab6;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font: 15px/1.6 var(--font-text); -webkit-font-smoothing: antialiased;
  padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px));
  padding-block: 0;
}
.app { max-width: 1180px; margin: 0 auto; min-height: 100vh; display: grid; grid-template-rows: auto 1fr auto; }

/* barra superiore */
.top { display: grid; gap: 12px; padding-block: 20px 8px; }
.top-row { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
.mark { font: 600 0.95rem var(--font-display); letter-spacing: -0.01em; }
.step-name { font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.progress { display: flex; gap: 4px; }
.progress button { flex: 1; height: 18px; border: 0; padding: 7px 0; background: none; cursor: pointer; }
.progress button::after { content: ""; display: block; height: 4px; border-radius: 2px; background: var(--line); transition: background 0.2s; }
.progress button.seen::after { background: var(--faint); }
.progress button[aria-current="step"]::after { background: var(--accent); }
.progress button:hover::after { background: var(--muted); }

/* slide */
.slide { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 56px; align-items: start; padding-block: 28px 32px; outline: none; }
@media (max-width: 940px) { .slide { grid-template-columns: minmax(0, 1fr); gap: 28px; padding-block: 16px 24px; } }
.idea { display: grid; gap: 18px; align-content: start; min-width: 0; }
.eyebrow { font: 500 0.75rem var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); margin: 0; }
.idea h2 { font: 600 clamp(1.9rem, 3.6vw, 2.7rem)/1.08 var(--font-display); letter-spacing: -0.03em; margin: 0; text-wrap: balance; }
.lead { font-size: 1.08rem; color: var(--muted); margin: 0; max-width: 46ch; }
.formula { font: 0.92rem/1.9 var(--font-mono); color: var(--ink); border-left: 2px solid var(--accent); padding-left: 14px; margin: 0; overflow-x: auto; white-space: nowrap; }
.hear { display: grid; gap: 2px; margin: 0; max-width: 46ch; }
.hear span { font: 500 0.72rem var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
details.more { border-top: 1px solid var(--line); padding-top: 12px; max-width: 60ch; }
details.more summary { cursor: pointer; font-weight: 500; font-size: 0.9rem; color: var(--muted); list-style: none; display: flex; align-items: center; gap: 8px; }
details.more summary::-webkit-details-marker { display: none; }
details.more summary::before { content: "+"; font: 500 1rem var(--font-mono); width: 14px; }
details.more[open] summary::before { content: "−"; }
details.more .body { padding-top: 10px; font-size: 0.92rem; }
details.more p { margin: 0 0 10px; }
details.more ul { margin: 0 0 10px; padding-left: 18px; }

/* strumento */
.tool { background: var(--surface); border-radius: 18px; padding: 22px; display: grid; gap: 18px; min-width: 0; box-shadow: 0 1px 2px rgba(20, 20, 40, 0.04), 0 8px 28px rgba(20, 20, 40, 0.05); }
.plot { width: 100%; display: block; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 28px; }
.stat { display: grid; gap: 0; }
.stat b { font: 500 1.35rem var(--font-mono); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.stat span { font-size: 0.75rem; color: var(--muted); }
.knob { display: grid; gap: 6px; }
.knob-head { display: flex; justify-content: space-between; align-items: baseline; }
.knob label { font-size: 0.85rem; color: var(--muted); }
.knob output { font: 500 0.9rem var(--font-mono); font-variant-numeric: tabular-nums; }
.knob.main label { color: var(--ink); font-weight: 600; }
.knob.main output { font-size: 1.1rem; color: var(--accent); }
.knobs { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px 24px; }
input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; background: transparent; margin: 0; cursor: pointer; }
input[type="range"]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: var(--line); }
input[type="range"]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--line); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--ink); margin-top: -6px; border: 0; }
input[type="range"]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--ink); border: 0; }
.knob.main input[type="range"]::-webkit-slider-thumb { background: var(--accent); width: 20px; height: 20px; margin-top: -8px; }
.knob.main input[type="range"]::-moz-range-thumb { background: var(--accent); width: 20px; height: 20px; }
input[type="range"]:disabled { opacity: 0.35; }

.listen { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.play { display: inline-flex; align-items: center; gap: 12px; border: 0; background: none; padding: 0; font: 600 0.95rem var(--font-text); color: var(--ink); cursor: pointer; }
.play i { width: 48px; height: 48px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; flex: none; transition: transform 0.15s; }
.play i::before { content: ""; border-left: 13px solid var(--accent-ink); border-top: 8px solid transparent; border-bottom: 8px solid transparent; margin-left: 3px; }
.play.on i::before { border: 0; width: 13px; height: 13px; background: var(--accent-ink); margin: 0; border-radius: 2px; }
.play:hover i { transform: scale(1.05); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 500 0.82rem var(--font-text); color: var(--muted); background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; cursor: pointer; }
.chip:hover { color: var(--ink); border-color: var(--faint); }
.chip.on, .chip[aria-pressed="true"] { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }
details.opts summary { cursor: pointer; font-size: 0.82rem; color: var(--muted); list-style: none; }
details.opts summary::-webkit-details-marker { display: none; }
details.opts summary::after { content: " ▾"; }
details.opts[open] summary::after { content: " ▴"; }
details.opts .knobs { padding-top: 12px; }
.field { display: grid; gap: 6px; }
.field > span { font-size: 0.85rem; color: var(--muted); }
.divider { height: 1px; background: var(--line); }
.sub { font: 500 0.72rem var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 0; }
.feedback { font-size: 0.9rem; color: var(--muted); min-height: 1.6em; margin: 0; }
.chip.right { background: var(--good); border-color: var(--good); color: var(--accent-ink); }
.chip.wrong { border-color: var(--icse); color: var(--icse); }

/* diagramma della catena */
.chain { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.chain li { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 9px 0; position: relative; }
.chain li::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--surface); border: 2px solid var(--faint); justify-self: center; z-index: 1; }
.chain li::after { content: ""; position: absolute; left: 8px; top: 0; bottom: 0; width: 2px; background: var(--line); }
.chain li:first-child::after { top: 50%; } .chain li:last-child::after { bottom: 50%; }
.chain li.fx::before { border-color: var(--accent); background: var(--accent); }
.chain li b { font-weight: 500; }
.chain li small { font: 0.75rem var(--font-mono); color: var(--muted); }
.chain li em { font: normal 500 0.72rem var(--font-mono); color: var(--accent); }

table.map { border-collapse: collapse; width: 100%; font-size: 0.86rem; }
table.map td { padding: 7px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
table.map td + td { padding-left: 16px; color: var(--muted); }
.cta { display: inline-flex; align-items: center; gap: 10px; background: var(--accent); color: var(--accent-ink); text-decoration: none; font-weight: 600; padding: 14px 22px; border-radius: 999px; width: fit-content; }
.feat { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.feat li { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 10px; }
.feat li::before { content: "→"; color: var(--accent); }

/* barra inferiore */
.bottom { position: sticky; bottom: 0; background: var(--bg); display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px calc(16px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); z-index: 5; }
.btn { font: 500 0.92rem var(--font-text); border-radius: 999px; padding: 10px 20px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.now { font: 0.78rem var(--font-mono); color: var(--accent); flex: 1; min-width: 0; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
button:focus-visible, input:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
@media (prefers-reduced-motion: no-preference) { .slide { animation: rise 0.35s ease-out; } @keyframes rise { from { opacity: 0; transform: translateY(6px); } } }
</style>

<div class="app">
  <header class="top">
    <div class="top-row">
      <span class="mark">Anatomia della Stranezza</span>
      <span class="step-name" id="stepName"></span>
    </div>
    <nav class="progress" id="progress" aria-label="Passi del tutorial"></nav>
  </header>
  <main class="slide" id="slide" tabindex="-1"></main>
  <footer class="bottom">
    <button type="button" class="btn" id="prev">Indietro</button>
    <span class="now" id="now" aria-live="polite"></span>
    <button type="button" class="btn primary" id="next">Ho capito</button>
  </footer>
</div>

<script id="engine" type="javascript/worker">
// Motore di sintesi: stesso modello di lab.html e sonify.py.
const SINN = 8192, SIN = new Float32Array(SINN + 1);
for (let i = 0; i <= SINN; i++) SIN[i] = Math.sin(2 * Math.PI * i / SINN);
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function boxPass(src, dst, r) {
  const n = src.length, w = 2 * r + 1; let acc = 0;
  for (let j = -r; j <= r; j++) acc += src[Math.min(n - 1, Math.max(0, j))];
  for (let i = 0; i < n; i++) { dst[i] = acc / w; acc += src[Math.min(n - 1, i + r + 1)] - src[Math.max(0, i - r)]; }
}
function smooth(a, sigma) {
  if (sigma < 1) return a;
  const r = Math.floor(Math.round(Math.sqrt(4 * sigma * sigma + 1)) / 2);
  let A = a, B = new Float32Array(a.length);
  for (let k = 0; k < 3; k++) { boxPass(A, B, r); const t = A; A = B; B = t; }
  return A;
}
function sCurve(spec, n, sr) {
  let s = new Float32Array(n);
  if (spec.type === "const") s.fill(spec.v);
  else if (spec.type === "ramp") { for (let i = 0; i < n; i++) s[i] = spec.from + (spec.to - spec.from) * i / Math.max(1, n - 1); }
  else {
    const v = spec.values, NY = v.length, spy = spec.spy;
    for (let i = 0; i < n; i++) {
      const ty = i / sr / spy - 0.5, k = Math.floor(ty);
      s[i] = ty <= 0 ? v[0] : k >= NY - 1 ? v[NY - 1] : v[k] + (v[k + 1] - v[k]) * (ty - k);
    }
    s = smooth(s, 0.25 * spy * sr);
    for (let i = 0; i < n; i++) s[i] = Math.pow(Math.max(0, s[i]), spec.gamma);
  }
  return s;
}
function render(job) {
  const sr = job.sr, n = Math.max(1, Math.round(job.dur * sr));
  const L = new Float32Array(n), R = new Float32Array(n);
  const rng = mulberry32(job.seed || 7);
  const gauss = () => { let u = 0; while (u === 0) u = rng(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * rng()); };
  const fx = job.fx, NP = job.partials, nyq = 0.45 * sr, TWO_PI = 2 * Math.PI, BS = 32, nb = Math.ceil(n / BS);
  const TB = 4096, table = new Float32Array(TB);
  for (let k = 1; k <= NP; k++) { const a = Math.pow(k, -2.2); for (let i = 0; i < TB; i++) table[i] += a * Math.sin(TWO_PI * k * i / TB); }
  let tm = 0; for (let i = 0; i < TB; i++) tm = Math.max(tm, Math.abs(table[i])); for (let i = 0; i < TB; i++) table[i] /= tm || 1;
  for (const vc of job.voices) {
    const s = sCurve(vc.s, n, sr);
    const gl = Math.sqrt((1 - vc.pan) / 2), gr = Math.sqrt((1 + vc.pan) / 2);
    let x = null;
    if (vc.note !== false) {
      const sC = new Float32Array(nb + 1), fC = new Float32Array(nb + 1);
      for (let b = 0; b <= nb; b++) sC[b] = s[Math.min(n - 1, b * BS)];
      let jn = null;
      if (fx.jitter > 0) {
        jn = new Float32Array(nb + 1); for (let b = 0; b <= nb; b++) jn[b] = gauss();
        jn = smooth(jn, 0.03 * sr / BS);
        let m = 0; for (let b = 0; b <= nb; b++) m = Math.max(m, Math.abs(jn[b]));
        for (let b = 0; b <= nb; b++) jn[b] /= m || 1;
      }
      for (let b = 0; b <= nb; b++) {
        let c = vc.dir * fx.detune * sC[b]; if (jn) c += fx.jitter * jn[b] * sC[b];
        fC[b] = vc.f0 * Math.pow(2, c / 1200);
      }
      const B = fx.inharm / 1000, T = fx.bright;
      x = new Float32Array(n);
      for (let k = 1; k <= NP; k++) {
        let ph = rng(); const k2 = k * k, lk = Math.log(k), base = Math.pow(k, -2.2);
        const gate = b => job.buildup ? Math.max(0, Math.min(1, (b * BS / sr - (k - 1) * job.buildup) / 0.06)) : 1;
        const fkAt = b => B > 0 ? k * fC[b] * Math.sqrt(1 + B * sC[b] * k2) : k * fC[b];
        const ampAt = (b, fk) => fk >= nyq ? 0 : (T > 0 ? base * Math.exp(T * sC[b] * lk) : base) * gate(b);
        let fa = fkAt(0), aa = ampAt(0, fa);
        for (let b = 0; b < nb; b++) {
          const fb = fkAt(b + 1), ab = ampAt(b + 1, fb);
          const i0 = b * BS, i1 = Math.min(n, i0 + BS), len = i1 - i0;
          if (aa === 0 && ab === 0) { ph += (fa + fb) / 2 / sr * len; ph -= Math.floor(ph); fa = fb; aa = ab; continue; }
          let inc = fa / sr, amp = aa; const dinc = (fb - fa) / sr / len, damp = (ab - aa) / len;
          for (let i = i0; i < i1; i++) {
            const p = ph * SINN, j = p | 0;
            x[i] += amp * (SIN[j] + (SIN[j + 1] - SIN[j]) * (p - j));
            ph += inc; if (ph >= 1) ph -= 1; inc += dinc; amp += damp;
          }
          fa = fb; aa = ab;
        }
      }
      let m = 0; for (let i = 0; i < n; i++) m = Math.max(m, Math.abs(x[i])); m = m || 1;
      for (let i = 0; i < n; i++) {
        let v = x[i] / m;
        if (fx.fold > 0) { const si = s[i]; v = (1 - si) * v + si * Math.sin(Math.PI / 2 * (1 + fx.fold * si) * v); }
        if (job.breath) { const sn = Math.sin(TWO_PI * 0.11 * i / sr + vc.f0); v *= 0.6 + 0.4 * sn * sn; }
        x[i] = v;
      }
    }
    let gph = 0; const ginc = vc.f0 / sr * TB, gv = vc.ghost || 0;
    for (let i = 0; i < n; i++) {
      let v = x ? x[i] : 0;
      if (gv > 0) { const gi = gph | 0, gf = gph - gi; v += gv * (table[gi] + (table[(gi + 1) % TB] - table[gi]) * gf); gph += ginc; if (gph >= TB) gph -= TB; }
      L[i] += v * gl; R[i] += v * gr;
    }
  }
  let peak = 0; for (let i = 0; i < n; i++) peak = Math.max(peak, Math.abs(L[i]), Math.abs(R[i]));
  const g = peak > 0 ? 0.85 / peak : 0;
  for (let i = 0; i < n; i++) { L[i] *= g; R[i] *= g; }
  if (job.beat && job.beat.vol > 0) {
    const bt = job.beat, len = Math.round(0.3 * sr), NY = Math.round(job.dur / bt.spy);
    for (let y = 0; y < NY; y++) {
      const accent = bt.accent && (2006 + y) % 5 === 0, st = Math.round(y * bt.spy * sr), a = bt.vol * (accent ? 0.9 : 0.5);
      for (let j = 0; j < len && st + j < n; j++) {
        const t = j / sr;
        let v = 0.7 * Math.sin(TWO_PI * 1250 * t) * Math.exp(-t / 0.010) + 0.35 * Math.sin(TWO_PI * 2780 * t) * Math.exp(-t / 0.006);
        if (accent) v += 0.9 * Math.sin(TWO_PI * 62 * t) * Math.exp(-t / 0.09);
        L[st + j] += v * a; R[st + j] += v * a;
      }
    }
    let pk = 0; for (let i = 0; i < n; i++) pk = Math.max(pk, Math.abs(L[i]), Math.abs(R[i]));
    if (pk > 0.98) { const k = 0.98 / pk; for (let i = 0; i < n; i++) { L[i] *= k; R[i] *= k; } }
  }
  const fe = Math.min(n >> 1, Math.round(0.015 * sr));
  for (let i = 0; i < fe; i++) { const w = i / fe; L[i] *= w; R[i] *= w; L[n - 1 - i] *= w; R[n - 1 - i] *= w; }
  return { L, R, sr };
}
self.onmessage = e => {
  const r = render(e.data.job);
  self.postMessage({ id: e.data.id, L: r.L, R: r.R, sr: r.sr }, [r.L.buffer, r.R.buffer]);
};
</script>

<script>
(function () {
"use strict";
// ---------------- dati e valori predefiniti (uguali a lab.html) ----------------
const YEARS = []; for (let y = 2006; y <= 2025; y++) YEARS.push(y);
const DATA = {
  ICSE: [395,334,371,405,380,441,408,461,496,452,530,415,502,529,617,615,691,780,1049,1150],
  FSE:  [125,251,152,217,169,203,201,251,273,291,266,295,295,303,360,407,449,465,474,515],
  ASE:  [121,312,280,220,190,252,138,254,276,289,284,367,386,448,395,440,531,633,587,1181]
};
const NAMES = ["ICSE", "FSE", "ASE"];
const CHORD = { ICSE: { f0: 110, pan: -0.7, dir: -1 }, FSE: { f0: 165, pan: 0, dir: 1 }, ASE: { f0: 220, pan: 0.7, dir: 1 } };
const DEF = { sr: 44100, partials: 28, f0: 220, ghost: 0.35, threshold: 1.25, saturate: 1.4, gamma: 1.3, spy: 1, beat: 0.5, accent: true, breath: false,
  fx: { detune: 90, jitter: 20, inharm: 2.5, bright: 1.2, fold: 5 } };
const NOFX = { detune: 0, jitter: 0, inharm: 0, bright: 0, fold: 0 };
const NOTES = [[110, "La2"], [146.83, "Re3"], [220, "La3"], [293.66, "Re4"]];
const median = a => { const s = a.slice().sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const normOf = name => median(DATA[name].slice(0, 10));

// ---------- slide di un effetto: una nota, un solo effetto ----------
function effectSlide(def) {
  addSlide({
    id: def.id, label: def.label, eyebrow: def.eyebrow, title: def.title, lead: def.lead, formula: def.formula, hear: def.hear, more: def.more,
    build(t) {
      const st = { s: 0.6, depth: def.depth.value, f0: DEF.f0, ghost: def.ghost ?? DEF.ghost, live: null };
      const sv = () => st.live ?? st.s;
      const draw = plot(t, def.height || 240, (ctx, w, h) => def.draw(ctx, w, h, st, sv()));
      const statsSet = stats(t);
      const k = el("div", { class: "knobs" }); t.append(k);
      const sK = knob(k, { label: "Stranezza s", main: true, min: 0, max: 1, step: 0.01, value: st.s, fmt: v => fmtN(v), onInput: v => { st.s = v; st.live = null; redraw(); } });
      knob(k, Object.assign({}, def.depth, { onInput: v => { st.depth = v; redraw(); } }));
      const fx = () => Object.assign({}, NOFX, { [def.key]: st.depth });
      const job = (s, d = 2.5) => ({ dur: d, partials: DEF.partials, fx: fx(), voices: [voice({ f0: st.f0, ghost: st.ghost, s })] });
      options(t, b => {
        knob(b, { label: "Voce fantasma", min: 0, max: 1, step: 0.05, value: st.ghost, fmt: v => v ? Math.round(v * 100) + "%" : "spenta", onInput: v => { st.ghost = v; redraw(); } });
        chips(b, { title: "Fondamentale f₀", label: "Fondamentale", options: NOTES, value: st.f0, onChange: v => { st.f0 = v; redraw(); } });
      });
      function redraw() { draw.redraw(); statsSet(def.stats(st, sv())); }
      redraw();
      listen(t, { label: "Rampa: s da 0 a 1", run: b => playJobs(b, [job({ type: "ramp", from: 0, to: 1 }, 6)], `${def.label} · rampa`, p => { st.live = p ? p.frac : null; sK.set(sv()); redraw(); }) }, [
        { label: "Pulita", run: b => playJobs(b, [job(C(0))], "nota pulita") },
        { label: "Con effetto", run: b => playJobs(b, [job(C(st.s))], `${def.label} · s = ${fmtN(st.s)}`) },
        { label: "A/B", run: b => playJobs(b, [job(C(0)), job(C(st.s))], `A pulita · B ${def.label}`) }
      ]);
    }
  });
}

effectSlide({

      if (ph != null) line(ctx, [[a.X(ph * 20), a.m.t], [a.X(ph * 20), h - a.m.b]], css("--accent"), 2);
      ctx.font = `11px ${css("--font-mono")}`; ctx.textAlign = "left"; ctx.textBaseline = "top";
      NAMES.forEach((n, j) => { ctx.fillStyle = css(`--${n.toLowerCase()}`); ctx.fillText(n, a.m.l + 6 + j * 52, a.m.t); });
    });
    const k = el("div", { class: "knobs" }); t.append(k);
    knob(k, { label: "Durata di un anno", min: 0.4, max: 2, step: 0.05, value: st.spy, fmt: v => fmtN(v) + " s", onInput: v => { st.spy = v; } });
    knob(k, { label: "Volume del beat", min: 0, max: 1, step: 0.05, value: st.beat, fmt: v => v ? Math.round(v * 100) + "%" : "spento", onInput: v => { st.beat = v; } });
    options(t, b => { const c = el("div", { class: "chips" }); b.append(c); toggle(c, "Accento ogni 5 anni", st.accent, v => { st.accent = v; ch.redraw(); }); toggle(c, "Respiro lento", st.breath, v => { st.breath = v; }); });
    ch.redraw();
    const prog = p => { ph = p ? p.t / (20 * st.spy) : null; ch.redraw(); };
    listen(t, { label: "Ascolta il brano completo", run: b => playJobs(b, [fullPieceJob({ spy: st.spy, beat: st.beat, accent: st.accent, breath: st.breath })], "brano completo", prog) }, [
      { label: "Solo beat", run: b => playJobs(b, [{ dur: 20 * st.spy, partials: DEF.partials, fx: NOFX, voices: [], beat: { vol: Math.max(st.beat, 0.3), accent: st.accent, spy: st.spy } }], "beat", prog) }
    ]);
  }
});

const FX_NAMES = { detune: "Detune", jitter: "Jitter", inharm: "Inarmonicità", bright: "Spectral tilt", fold: "Wavefolding" };
const FX_CUES = {
  detune: "battimenti regolari con il fantasma, che accelerano in modo uniforme.",
  jitter: "altezza instabile e battimenti irregolari, senza ritmo.",
  inharm: "la fondamentale resta, ma sopra compaiono componenti che non si fondono: timbro metallico.",
  bright: "suono più chiaro e tagliente, senza cambiare altezza né stabilità.",
  fold: "cambia la grana: da liscia a ronzante e ruvida, a salti."
};
addSlide({
  id: "ascolto", label: "Ascolto", eyebrow: "Passo 10 · Riconoscere",
  title: "Riconoscere gli effetti",
  lead: "Spegni un effetto alla volta nel brano completo, poi mettiti alla prova con il quiz.",
  formula: null,
  hear: "Altezza: detune e jitter. Coerenza: inarmonicità. Timbro: spectral tilt. Grana: wavefolding.",
  more: `<ul>${Object.keys(FX_NAMES).map(k => `<li><b>${FX_NAMES[k]}</b>: ${FX_CUES[k]}</li>`).join("")}</ul><p>Nella sottrazione concentrati sugli anni 2022–2025, dove s è più alta.</p>`,
  build(t) {
    const on = { detune: true, jitter: true, inharm: true, bright: true, fold: true };
    t.append(el("p", { class: "sub", text: "Sottrazione" }));
    const c = el("div", { class: "chips" }); t.append(c);
    Object.keys(FX_NAMES).forEach(k => toggle(c, FX_NAMES[k], true, v => { on[k] = v; }));
    listen(t, { label: "Ascolta con gli effetti accesi", run: b => {
      const fx = {}; Object.keys(FX_NAMES).forEach(k => fx[k] = on[k] ? DEF.fx[k] : 0);
      const off = Object.keys(FX_NAMES).filter(k => !on[k]).map(k => FX_NAMES[k]);
      playJobs(b, [fullPieceJob({ fx })], off.length ? "senza " + off.join(", ") : "brano completo", p => { if (p) nowEl.textContent = `▶ ${YEARS[Math.min(19, Math.floor(p.t))]}` + (off.length ? " · senza " + off.join(", ") : ""); });
    } });
    t.append(el("div", { class: "divider" }));
    t.append(el("p", { class: "sub", text: "Quiz" }));
    const q = { key: null, right: 0, total: 0, done: false }, keys = Object.keys(FX_NAMES);
    const fb = el("p", { class: "feedback", "aria-live": "polite", text: "Ascolta una rampa con un solo effetto e indovina quale." });
    const ans = el("div", { class: "chips" });
    const btns = keys.map(k => { const b = el("button", { type: "button", class: "chip", text: FX_NAMES[k], disabled: "" }); b.addEventListener("click", () => answer(k, b)); ans.append(b); return b; });
    const job = () => ({ dur: 6, partials: DEF.partials, fx: Object.assign({}, NOFX, { [q.key]: DEF.fx[q.key] }), voices: [voice({ ghost: DEF.ghost, s: { type: "ramp", from: 0, to: 1 } })] });
    listen(t, { label: "Nuovo quesito", run: b => { let k; do { k = keys[Math.floor(Math.random() * keys.length)]; } while (k === q.key && Math.random() < 0.7);
      q.key = k; q.done = false; fb.textContent = "Quale effetto senti?"; btns.forEach(x => { x.disabled = false; x.classList.remove("right", "wrong"); }); playJobs(b, [job()], "quiz"); } },
      [{ label: "Riascolta", run: b => { if (q.key) playJobs(b, [job()], "quiz"); } }]);
    t.append(ans, fb);
    function answer(k, b) {
      if (q.done) return; q.done = true; q.total++;
      if (k === q.key) { q.right++; b.classList.add("right"); fb.textContent = `Giusto · ${q.right} su ${q.total}. ${FX_NAMES[k]}: ${FX_CUES[k]}`; }
      else { b.classList.add("wrong"); btns[keys.indexOf(q.key)].classList.add("right"); fb.textContent = `Era ${FX_NAMES[q.key]} · ${q.right} su ${q.total}. ${FX_CUES[q.key]}`; }
    }
  }
});

addSlide({
  id: "tool", label: "Tool", eyebrow: "Fine",
  title: "Pronto per il tool",
  lead: "Il tool usa gli stessi parametri, con gli stessi nomi e valori, e aggiunge la vista completa del brano.",
  formula: null,
  hear: "Nel tool il pulsante «Solo» su ogni effetto fa lo stesso isolamento di queste slide.",
  more: `<table class="map"><tbody>${[
    ["Soglia, saturazione, scala, γ", "Dal dato alla stranezza"], ["Dati reali o rampa", "Ascolto · Sorgente della stranezza"], ["Accordo o conferenza singola", "Ascolto · Cosa suonare"],
    ["Parziali, nota, voce fantasma, respiro", "Voci"], ["Detune, jitter, inarmonicità, spectral tilt, wavefolding", "Effetti di sintesi"],
    ["Durata di un anno, beat, accento", "Tempo e beat"], ["Norma, smussamento", "fissi"]].map(([a, b]) => `<tr><td>${a}</td><td>${b}</td></tr>`).join("")}</tbody></table>`,
  build(t) {
    t.append(el("ul", { class: "feat" }, [
      el("li", { text: "Spettrogramma 3D del brano, con viste Prospettiva, Dall'alto, Profilo e Barre" }),
      el("li", { text: "Barra del tempo per muoversi tra gli anni" }),
      el("li", { text: "Esportazione delle impostazioni per generare i WAV con sonify.py" })
    ]));
    t.append(el("a", { class: "cta", href: "lab.html", text: "Apri Sottomissioni in Suono →" }));
  }
});

// ---------------- navigazione ----------------
const progEl = document.getElementById("progress"), slideEl = document.getElementById("slide"), nameEl = document.getElementById("stepName");
const prevBtn = document.getElementById("prev"), nextBtn = document.getElementById("next");
let seen = new Set();
try { seen = new Set(JSON.parse(localStorage.getItem("anatomia-done") || "[]")); } catch (e) {}
const save = () => { try { localStorage.setItem("anatomia-done", JSON.stringify([...seen])); } catch (e) {} };
let cur = 0;
SLIDES.forEach((s, i) => progEl.append(el("button", { type: "button", "aria-label": `${i + 1}. ${s.label}`, title: s.label, onclick: () => go(i) })));
function go(i) {
  i = Math.max(0, Math.min(SLIDES.length - 1, i));
  stopAudio(); cur = i;
  const s = SLIDES[i];
  slideEl.textContent = "";
  const idea = el("article", { class: "idea" }, [el("p", { class: "eyebrow", text: s.eyebrow }), el("h2", { text: s.title }), el("p", { class: "lead", text: s.lead })]);
  if (s.formula) idea.append(el("div", { class: "formula" }, s.formula.map(f => el("div", { text: f }))));
  if (s.hear) idea.append(el("p", { class: "hear" }, [el("span", { text: "Cosa ascoltare" }), s.hear]));
  if (s.more) { const d = el("details", { class: "more" }, [el("summary", { text: "Approfondimento tecnico" })]); d.append(el("div", { class: "body", html: s.more })); idea.append(d); }
  const tool = el("section", { class: "tool", "aria-label": "Esperimento" });
  slideEl.append(idea, tool);
  s.build(tool);
  nameEl.textContent = `${i + 1} / ${SLIDES.length} · ${s.label}`;
  [...progEl.children].forEach((b, j) => { b.classList.toggle("seen", seen.has(SLIDES[j].id)); if (j === i) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current"); });
  prevBtn.disabled = i === 0;
  nextBtn.textContent = i === SLIDES.length - 1 ? "Fine" : "Ho capito";
  if (location.hash !== "#" + s.id) history.replaceState(null, "", "#" + s.id);
  window.scrollTo({ top: 0 }); slideEl.focus({ preventScroll: true });
}
prevBtn.addEventListener("click", () => go(cur - 1));
nextBtn.addEventListener("click", () => { seen.add(SLIDES[cur].id); save(); go(cur < SLIDES.length - 1 ? cur + 1 : cur); });
document.addEventListener("keydown", e => {
  if (e.target.closest("input, select, textarea, summary")) return;
  if (e.key === "ArrowRight") go(cur + 1); else if (e.key === "ArrowLeft") go(cur - 1);
});
window.addEventListener("hashchange", () => { const i = SLIDES.findIndex(s => "#" + s.id === location.hash); if (i >= 0 && i !== cur) go(i); });
const start = SLIDES.findIndex(s => "#" + s.id === location.hash);
go(start >= 0 ? start : 0);
})();
</script>
